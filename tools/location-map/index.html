<style>html,body{margin:0;height:100%;font-family:system-ui;background:#101c22;color:#ecf3f4}body{display:grid;grid-template-rows:minmax(0,1fr) auto}#map{min-height:0;position:relative}.map-controls{position:absolute;z-index:2;right:12px;top:12px;display:grid;gap:6px}.map-controls button,.map-controls select{font:600 13px system-ui;border:1px solid #667b83;background:#12252d;color:#fff;border-radius:10px;padding:10px;min-height:44px}header{height:46px;padding:0 16px;display:flex;align-items:center;font-weight:650}footer{font-size:12px;padding:8px 14px}#status{margin-top:3px;color:#a8bfca}.maplibregl-ctrl-attrib{font-size:11px}</style>
