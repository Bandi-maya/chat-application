<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org; connect-src https://tiles.openfreemap.org; worker-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer"><link rel="stylesheet" href="map.css"><title>Location map</title><link rel="icon" href="data:,">
<style>html,body{margin:0;height:100vh;min-height:100vh;font-family:system-ui;background:#101c22;color:#ecf3f4}body{overflow:hidden}#map{position:absolute;left:0;top:0;width:100vw;height:100vh;min-height:1px}.map-controls{position:absolute;z-index:2;right:8px;top:8px;display:grid;justify-items:end;gap:4px}.map-controls button,.map-controls select{font:600 13px system-ui;border:1px solid #4a575e;background:#202c32;color:#fff;border-radius:50%;box-shadow:0 2px 7px #0002;padding:8px;min-height:48px;min-width:48px;touch-action:manipulation}header{height:46px;padding:0 16px;display:flex;align-items:center;font-weight:650}footer{position:absolute;bottom:0;left:0;right:0;z-index:2;pointer-events:none;font-size:12px;padding:8px 14px;background:#101c22d9}#status{margin-top:3px;color:#a8bfca}.maplibregl-ctrl-attrib{font-size:11px}.maplibregl-ctrl-bottom-right{bottom:58px}#zoom-in,#zoom-out,#view-mode{width:48px;height:48px}#layers-trigger{width:48px;height:48px;display:grid;place-items:center}.layer-picker{position:relative}#layers-menu{position:absolute;right:0;top:56px;min-width:152px;padding:6px;background:#253138;border:1px solid #4a575e;border-radius:20px;box-shadow:0 6px 18px #0003,0 1px 3px #0002;max-height:calc(100vh - 24px);overflow-y:auto;overscroll-behavior:contain}#layers-menu[hidden]{display:none}#layers-menu button{box-shadow:none;display:block;width:100%;border:0;border-radius:12px;text-align:left;padding:10px 14px}#layers-menu button[aria-checked=true]{background:#365f55;color:#fff}#layers-menu button[aria-checked=true]::after{content:'✓';float:right;margin-left:16px}button:focus-visible,select:focus-visible{outline:3px solid #5ee5cd;outline-offset:2px}
@media(min-width:600px) and (max-height:440px){.map-controls{display:flex;right:8px;top:8px;gap:4px}.map-controls button,.map-controls select{padding:8px;font-size:12px}footer{font-size:11px;padding:6px 10px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
.native-layers .map-controls{display:grid;gap:4px;right:8px;top:8px}.native-layers #zoom-in,.native-layers #zoom-out,.native-layers #view-mode{width:48px;height:48px}.map-controls[hidden]{display:none}
:root{color-scheme:light dark;--bg:#f8fafb;--fg:#172025;--surface:#e4eaed;--border:#abb8bf}html[data-theme=dark]{color-scheme:dark;--bg:#101c22;--fg:#ecf3f4;--surface:#253138;--border:#52626b}html[data-theme=light]{color-scheme:light}@media(prefers-color-scheme:dark){html:not([data-theme]){--bg:#101c22;--fg:#ecf3f4;--surface:#253138;--border:#52626b}}html,body{background:var(--bg);color:var(--fg)}.map-controls button,#layers-menu{background:var(--surface);color:var(--fg);border-color:var(--border)}footer{background:var(--bg)}footer:has(#status:empty){display:none}#status{color:var(--fg)}.maplibregl-ctrl-bottom-right{bottom:0;max-width:100%}.maplibregl-ctrl-attrib{background:var(--bg);color:var(--fg);font-size:12px;line-height:20px;white-space:normal}.maplibregl-ctrl-attrib{box-sizing:border-box;max-width:calc(100vw - 16px);margin-right:8px!important}.maplibregl-ctrl-attrib-inner{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;column-gap:6px;white-space:normal}.maplibregl-ctrl-attrib a{color:var(--fg);display:inline-block;padding:6px 0;min-height:20px}.maplibregl-ctrl-attrib-button{display:none}
.maplibregl-ctrl-attrib{display:none}
</style>
</head><body><div id="map"></div><div class="map-controls" role="group" aria-label="Map controls"><button id="zoom-in" aria-label="Zoom in">+</button><button id="zoom-out" aria-label="Zoom out">-</button><button id="view-mode" aria-pressed="false" aria-label="Toggle 3D buildings">3D</button><div class="layer-picker"><button id="layers-trigger" aria-label="Map layers" aria-haspopup="menu" aria-expanded="false" aria-controls="layers-menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m3 7 9-5 9 5-9 5-9-5Zm0 5 9 5 9-5M3 17l9 5 9-5"/></svg></button><div id="layers-menu" role="menu" aria-label="Map style" hidden><button role="menuitemradio" aria-checked="true" data-style="liberty">Streets</button><button role="menuitemradio" aria-checked="false" data-style="positron">Light</button><button role="menuitemradio" aria-checked="false" data-style="dark">Dark</button><button role="menuitemradio" aria-checked="false" data-style="bright">Bright</button><button role="menuitemradio" aria-checked="false" data-style="fiord">Fiord</button></div></div></div><footer><div id="status" aria-live="polite"></div></footer><script src="map.js"></script></body></html>
