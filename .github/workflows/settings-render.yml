{"name": "Settings render (test only) v4", "on": {"workflow_dispatch": {}, "push": {"branches": ["themes"], "paths": [".github/workflows/settings-render.yml", "test/settings_root_render_test.dart", "lib/features/settings/settings_root_screen.dart"]}}, "permissions": {"contents": "read"}, "jobs": {"r": {"runs-on": "ubuntu-latest", "timeout-minutes": 30, "steps": [{"uses": "actions/checkout@v4"}, {"uses": "subosito/flutter-action@v2", "with": {"channel": "stable", "cache": true}}, {"name": "Render", "continue-on-error": true, "run": "touch .env; flutter pub get; export FLUTTER_ROOT=$(dirname $(dirname $(readlink -f $(which flutter)))); echo FLUTTER_ROOT=$FLUTTER_ROOT; ls $FLUTTER_ROOT/bin/cache/artifacts/material_fonts; flutter test test/settings_root_render_test.dart 2>&1 | tee build_log.txt"}, {"name": "Print renders to log (base64, for retrieval)", "if": "always()", "run": "for f in build/settings_render/*.png; do echo \"B64START $f\"; base64 -w0 $f; echo; echo B64END; done"}, {"uses": "actions/upload-artifact@v4", "if": "always()", "with": {"name": "settings-render", "path": "build/settings_render/*.png\nbuild_log.txt", "if-no-files-found": "warn"}}]}}}
