{"name": "Settings render and bubble tests (test only) v21", "on": {"workflow_dispatch": {}, "push": {"branches": ["themes"], "paths": [".github/workflows/settings-render.yml", "test/settings_root_render_test.dart", "lib/features/settings/settings_root_screen.dart", "test/bubble_catalog_roundtrip_test.dart", "lib/features/settings/conversation/conversation_bubble_and_ticks_screen.dart", "test/tick_catalog_roundtrip_test.dart", "lib/ui/core/ticks/**", "test/settings_studios_render_test.dart"]}}, "permissions": {"contents": "read"}, "jobs": {"r": {"runs-on": "ubuntu-latest", "timeout-minutes": 30, "steps": [{"uses": "actions/checkout@v4"}, {"uses": "subosito/flutter-action@v2", "with": {"channel": "stable", "cache": true}}, {"name": "Bubble catalog test and analyze", "continue-on-error": true, "run": "touch .env; flutter pub get; flutter test test/bubble_catalog_roundtrip_test.dart test/tick_catalog_roundtrip_test.dart 2>&1 | tee bubble_log.txt; flutter analyze --no-fatal-infos lib/features/settings/conversation/conversation_bubble_and_ticks_screen.dart lib/features/settings/settings_root_screen.dart lib/ui/core/ticks 2>&1 | tee -a bubble_log.txt"}, {"name": "Render", "continue-on-error": true, "run": "touch .env; flutter pub get; export FLUTTER_ROOT=$(dirname $(dirname $(readlink -f $(which flutter)))); echo FLUTTER_ROOT=$FLUTTER_ROOT; ls $FLUTTER_ROOT/bin/cache/artifacts/material_fonts; flutter test test/settings_root_render_test.dart test/settings_studios_render_test.dart 2>&1 | tee build_log.txt"}, {"name": "Print renders to log (base64, for retrieval)", "if": "always()", "run": "for f in build/settings_render/*.png; do echo \"B64START $f\"; base64 -w0 $f; echo; echo B64END; done"}, {"name": "Print logs summary", "if": "always()", "run": "echo ===UNIT; grep -n -E 'All tests|tests passed|Some tests|Error|error' bubble_log.txt | cut -c1-200 | head -20; echo ===END"}, {"uses": "actions/upload-artifact@v4", "if": "always()", "with": {"name": "settings-render", "path": "build/settings_render/*.png\nbuild_log.txt\nbubble_log.txt", "if-no-files-found": "warn"}}]}}}
