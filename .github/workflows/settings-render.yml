{"name": "Settings render (test only) v3", "on": {"workflow_dispatch": {}, "push": {"branches": ["themes"], "paths": [".github/workflows/settings-render.yml", "test/settings_root_render_test.dart"]}}, "jobs": {"r": {"runs-on": "ubuntu-latest", "timeout-minutes": 30, "steps": [{"uses": "actions/checkout@v4"}, {"uses": "subosito/flutter-action@v2", "with": {"channel": "stable", "cache": true}}, {"name": "Render", "continue-on-error": true, "run": "touch .env; flutter pub get; flutter test test/settings_root_render_test.dart 2>&1 | tee build_log.txt"}, {"name": "Publish render to temp branch", "if": "always()", "run": "mkdir -p out && cp build/settings_render/*.png out/ 2>/dev/null; head -c 20000 build_log.txt > out/log_head.txt; tail -c 12000 build_log.txt > out/log_tail.txt; cd out && git init -q && git checkout -q -b render-out && git config user.email ci@example.com && git config user.name ci && git add -A && git commit -qm render && git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git render-out"}, {"uses": "actions/upload-artifact@v4", "if": "always()", "with": {"name": "settings-render", "path": "build/settings_render/*.png\nbuild_log.txt", "if-no-files-found": "warn"}}]}}, "permissions": {"contents": "write"}}
