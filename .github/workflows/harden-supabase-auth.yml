name: Chaty Hosted Auth Hardening

on:
  push:
    branches: [integration/phases-1-8]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harden-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: dntnxeanubswyswahdnj
    steps:
      - name: Skip hosted Auth hardening when no management token is configured
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "SUPABASE_ACCESS_TOKEN is not configured; hosted Auth hardening is skipped."
      - uses: actions/checkout@v6
        if: env.SUPABASE_ACCESS_TOKEN != ''
      - name: Enforce hosted password security
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: bash tools/harden_supabase_auth.sh
