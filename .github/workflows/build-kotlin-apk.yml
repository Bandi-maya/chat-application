name: Build kotlin APK

on:
  # Dispatch-only: editor-commit batches fire one manual build per slice,
  # never one build per file commit.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK (compile verification)
        run: gradle :app:assembleDebug --no-daemon
      - name: APK info
        if: always()
        run: |
          ls -l app/build/outputs/apk/debug/ 2>/dev/null || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then sha256sum app/build/outputs/apk/debug/app-debug.apk; fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: chaty-kotlin-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
