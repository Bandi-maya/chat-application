name: Build kotlin APK

on:
  workflow_dispatch:
  push:
    branches: [kotlin]
    paths:
      # Batched builds: bump ci/kotlin-build-trigger.txt once per committed
      # slice to fire exactly one build (editor commits land one file at a
      # time, so a broad push trigger would queue a full build per file).
      - ci/kotlin-build-trigger.txt
      - ci/kotlin-retry-trigger.txt

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.d.outputs.build }}
      retry: ${{ steps.d.outputs.retry }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: d
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          B="${{ github.event.before }}"
          if [ -z "$B" ] || [ "$B" = "0000000000000000000000000000000000000000" ]; then B="HEAD~1"; fi
          CH=$(git diff --name-only "$B" HEAD)
          printf 'GATE-CHANGED\n%s\n' "$CH"
          if printf '%s\n' "$CH" | grep -qx 'ci/kotlin-build-trigger.txt'; then echo "build=true" >> "$GITHUB_OUTPUT"; else echo "build=false" >> "$GITHUB_OUTPUT"; fi
          if printf '%s\n' "$CH" | grep -qx 'ci/kotlin-retry-trigger.txt'; then echo "retry=true" >> "$GITHUB_OUTPUT"; else echo "retry=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned cumulative candidate source
        run: |
          python3 - <<'PYOVERLAY'
          import base64,hashlib,json,pathlib,zipfile,io
          d=pathlib.Path('ci/candidate-overlay')
          m=json.loads((d/'manifest.json').read_text())
          raw=base64.b64decode(''.join(p.read_text().strip() for p in sorted(d.glob('part-*.b64'))),validate=True)
          assert hashlib.sha256(raw).hexdigest()==m['archive_sha256']
          z=zipfile.ZipFile(io.BytesIO(raw))
          assert set(z.namelist())==set(m['files'])
          for p in z.infolist():
              n=p.filename; q=pathlib.PurePosixPath(n)
              assert not q.is_absolute() and '..' not in q.parts and not n.startswith('.') and not n.endswith('/')
              assert (n == 'build.gradle.kts' or n.startswith(('app/','ci/','tools/location-map/'))) and '/build/' not in n and '/.env' not in n
              assert (p.external_attr >> 16) & 0o170000 != 0o120000
              data=z.read(p); assert hashlib.sha256(data).hexdigest()==m['files'][n]
              target=pathlib.Path(n); assert not target.is_symlink()
              assert all(not parent.is_symlink() for parent in target.parents)
              target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
          print('CANDIDATE-OVERLAY',m['archive_sha256'],'files',len(m['files']))
          PYOVERLAY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      # Rust cache: pruned target dir + cargo registry/bin, keyed on the
      # mls-native manifests. The earlier actions/cache entry exceeded the
      # per-cache size cap (3 ABI release targets), so saves failed and every
      # run did a full ~3.5 min rebuild. rust-cache prunes before saving.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            mls-native -> target
          cache-on-failure: true
      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
      - name: Set Android NDK for cargo-ndk
        run: |
          NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
      - name: Generate UniFFI bindings (diagnostic)
        run: |
          gradle :app:generateUniffiBindings --no-daemon
          echo '--- generated tree ---'
          find app/build/generated/uniffi -type f | head -20
      - name: Build debug APK (compile verification)
        run: gradle :app:assembleDebug --no-daemon
      - name: APK info
        if: always()
        run: |
          ls -l app/build/outputs/apk/debug/ 2>/dev/null || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then sha256sum app/build/outputs/apk/debug/app-debug.apk; fi
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            echo "--- APK content check (model/native libs) ---"
            echo "--- model assets ---"
            unzip -l "$APK" | grep -i "face_landmarker\|\.task$\|\.tflite$" || echo "NO MODEL ASSET FOUND"
            if unzip -l "$APK" | grep -q "assets/face_landmarker.task"; then
              GOT=$(unzip -p "$APK" assets/face_landmarker.task | sha256sum | cut -d' ' -f1)
              echo "MODEL sha256 in APK: $GOT"
              echo "MODEL sha256 pinned: 64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff"
              [ "$GOT" = "64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff" ] && echo "MODEL CHECKSUM MATCH" || echo "MODEL CHECKSUM MISMATCH"
            fi
            unzip -l "$APK" | grep -i "libchaty\|libmediapipe" || true
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            echo "--- badging ---"
            "$BT/aapt2" dump badging "$APK" 2>/dev/null | grep -E "^package:|sdkVersion|targetSdk" || true
            echo "--- signing ---"
            "$BT/apksigner" verify --print-certs "$APK" 2>&1 | head -6 || true
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: chaty-kotlin-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Compile instrumentation tests before emulator setup
        run: gradle :app:compileDebugAndroidTestKotlin --no-daemon

      - name: Unit tests (behavior parity)
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Report unit test totals
        if: always()
        run: |
          python3 - <<'PYTEST'
          import glob, xml.etree.ElementTree as ET
          roots = [ET.parse(p).getroot() for p in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')]
          totals = {k: sum(int(r.get(k, 0)) for r in roots) for k in ('tests', 'failures', 'errors', 'skipped')}
          print('UNIT-TEST-TOTALS', totals, 'suites', len(roots))
          PYTEST
      - name: Preserve unit test failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cumulative-unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

      # A separate synthetic pair is built once; never install the configured production artifact in fixtures.
      - name: Build isolated runtime APK pair once
        run: |
          printf '%s\n' 'REST_API_BASE_URL=http://10.0.2.2:8000' 'WEBSOCKET_URL=ws://10.0.2.2:8000/chat/ws/{userId}' 'TENANT_ID=chat-application' > .env
          gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
          mkdir -p runtime-apks
          cp app/build/outputs/apk/debug/app-debug.apk runtime-apks/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk runtime-apks/
          (cd runtime-apks && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-runtime-apk-pair
          path: runtime-apks/
          if-no-files-found: error

  # Runtime verification tier: boots the real app on an emulator and executes
  # the OpenMLS native engine over JNI (two-party protocol roundtrip, not app
  # E2E messaging). Separate job so the compile/test/APK job keeps its
  # duration. Same Rust cache as the build job, so its native build is warm.
  runtime-smoke:
    needs: [build, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [core-ui, media, emoji-real, emoji-loop, maps, calls-camera]
    env:
      CHATY_TEST_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned cumulative candidate source
        run: |
          python3 - <<'PYOVERLAY'
          import base64,hashlib,json,pathlib,zipfile,io
          d=pathlib.Path('ci/candidate-overlay')
          m=json.loads((d/'manifest.json').read_text())
          raw=base64.b64decode(''.join(p.read_text().strip() for p in sorted(d.glob('part-*.b64'))),validate=True)
          assert hashlib.sha256(raw).hexdigest()==m['archive_sha256']
          z=zipfile.ZipFile(io.BytesIO(raw))
          assert set(z.namelist())==set(m['files'])
          for p in z.infolist():
              n=p.filename; q=pathlib.PurePosixPath(n)
              assert not q.is_absolute() and '..' not in q.parts and not n.startswith('.') and not n.endswith('/')
              assert (n == 'build.gradle.kts' or n.startswith(('app/','ci/','tools/location-map/'))) and '/build/' not in n and '/.env' not in n
              assert (p.external_attr >> 16) & 0o170000 != 0o120000
              data=z.read(p); assert hashlib.sha256(data).hexdigest()==m['files'][n]
              target=pathlib.Path(n); assert not target.is_symlink()
              assert all(not parent.is_symlink() for parent in target.parents)
              target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
          print('CANDIDATE-OVERLAY',m['archive_sha256'],'files',len(m['files']))
          PYOVERLAY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - uses: actions/download-artifact@v4
        with:
          name: synthetic-runtime-apk-pair
          path: runtime-apks
      - name: Verify identical runtime APK pair
        run: |
          (cd runtime-apks && sha256sum -c SHA256SUMS)
          cp runtime-apks/SHA256SUMS runtime-apk-pair-SHA256SUMS.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Synthetic sessions must never reach the user's configured public server.
      - name: Isolate synthetic emulator backend routing
        run: |
          printf '%s\n' 'REST_API_BASE_URL=http://10.0.2.2:8000' 'WEBSOCKET_URL=ws://10.0.2.2:8000/chat/ws/{userId}' 'TENANT_ID=chat-application' > .env
      - name: Runtime bootstrap smoke (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          # Preserve upstream v2 default flags and explicitly expose both synthetic cameras.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-front emulated -camera-back emulated
          script: bash ci/run-smoke.sh
      - name: Preserve Android instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-results-${{ matrix.shard }}
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
      - name: Upload UI pixel proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-screens-pixel-proof-${{ matrix.shard }}
          path: |
            screenshots/
            runtime-apk-pair-SHA256SUMS.txt
          if-no-files-found: warn
      - name: Emit allowlisted synthetic fixture screenshots (base64)
        if: always()
        run: |
          # Allowlist only: deterministic test captures of the app's own auth screens (no input typed) and the
          # ChatFixtureActivity synthetic conversations. The failure-state capture is included: it only ever shows the app under the synthetic fixture session. Never the final screen or logcat.
          # This repository is public, so the job log is public: keep it bounded and fixture-only.
          for n in 00-failure-state 01-welcome 02-login 03-register 04-forgot-password 05-register-organization 06-chats-home 07-chat-detail 08-shell-light 09-shell-dark 10-approot-configured-shell 11-chat-detail-host 12-contact-info 13-restart-launch1-prompt 13-restart-launch1 13-restart-launch2-prompt 13-restart-launch2 real-host-hold-preready-toggle-before real-host-hold-preready-toggle-after real-host-hold-preready-toggle-decision real-host-hold-preready-finally real-host-hold-release-toggle-before real-host-hold-release-toggle-after real-host-hold-release-toggle-decision real-host-hold-release-finally real-host-hold-cancel-toggle-before real-host-hold-cancel-toggle-after real-host-hold-cancel-toggle-decision real-host-hold-cancel-finally real-host-hold-locked-toggle-before real-host-hold-locked-toggle-after real-host-hold-locked-toggle-decision real-host-hold-locked-finally real-host-hold-auth-toggle-before real-host-hold-auth-toggle-after real-host-hold-auth-toggle-decision real-host-hold-auth-finally real-host-hold-tenant-toggle-before real-host-hold-tenant-toggle-after real-host-hold-tenant-toggle-decision real-host-hold-tenant-finally 31-swipe-light-portrait-closed 31-swipe-light-portrait-progress 31-swipe-light-portrait-after-gesture 31-swipe-light-portrait-open 31-swipe-light-portrait-back-closed 31-swipe-light-portrait-leading 31-swipe-light-portrait-final 31-swipe-real-home-before 31-swipe-real-home-open 31-swipe-real-home-closed 31-swipe-applied-style-0-light-closed 31-swipe-applied-style-0-light-after-gesture 31-swipe-applied-style-0-light-open 31-swipe-applied-style-1-dark-closed 31-swipe-applied-style-1-dark-after-gesture 31-swipe-applied-style-1-dark-open 31-swipe-applied-style-2-light-closed 31-swipe-applied-style-2-light-after-gesture 31-swipe-applied-style-2-light-open 31-swipe-applied-style-3-dark-closed 31-swipe-applied-style-3-dark-after-gesture 31-swipe-applied-style-3-dark-open 31-swipe-applied-style-4-light-closed 31-swipe-applied-style-4-light-after-gesture 31-swipe-applied-style-4-light-open radial-dark-rtl-closed radial-dark-rtl-first-page radial-dark-rtl-first-page-missing radial-dark-rtl-page-2 radial-dark-rtl-page-2-missing radial-dark-rtl-page-3 radial-dark-rtl-page-3-missing radial-dark-rtl-missing-close-semantics 32-swipe-rtl-left-trailing 32-swipe-rtl-production-row-applied 32-swipe-rtl-production-row-reloaded 32-swipe-rtl-production-settings-before-navigation 32-swipe-rtl-production-settings-toggled 32-swipe-rtl-recreated-closed 32-swipe-rtl-right-leading hdr-sheet-light-initial hdr-sheet-light-before-preview-tap hdr-sheet-light-after-preview-tap hdr-sheet-light-selected hdr-sheet-light-scrolled-diag hdr-sheet-light-scrolled hdr-sheet-dark-initial hdr-sheet-dark-before-preview-tap hdr-sheet-dark-after-preview-tap hdr-sheet-dark-selected hdr-sheet-dark-scrolled-diag hdr-sheet-dark-scrolled voice-gesture-tap-toggle-false voice-gesture-tap-toggle-true voice-gesture-drag-cancel-false voice-gesture-drag-cancel-true voice-gesture-drag-locked-false voice-gesture-drag-locked-true voice-gesture-hold-release-false voice-gesture-hold-release-true voice-gesture-locked-delete-false voice-gesture-locked-delete-true voice-gesture-system-cancel-false voice-gesture-system-cancel-true; do
            f="screenshots/$n.png"
            [ -f "$f" ] || { echo "PNGMISSING $n"; continue; }
            sz=$(stat -c %s "$f")
            if [ "$sz" -gt 600000 ]; then echo "PNGSKIP $n size=$sz"; continue; fi
            echo "PNGB64-BEGIN $n $sz"
            base64 -w 0 "$f" | fold -w 4000 | sed 's/^/PNGB64 /'
            echo "PNGB64-END $n"
          done
          for n in hdr-sheet-scroll-light hdr-sheet-last-row-light hdr-sheet-scroll-dark hdr-sheet-last-row-dark; do
            f="screenshots/$n.txt"
            [ -f "$f" ] || { echo "TXTMISSING $n"; continue; }
            sz=$(stat -c %s "$f")
            if [ "$sz" -gt 200000 ]; then echo "TXTSKIP $n size=$sz"; continue; fi
            echo "TXT-BEGIN $n $sz"
            cat "$f"
            echo "TXT-END $n"
          done
          # Sanitized per-case toggle timing (no account data): budget/decision/elapsed/entry/native-state counts only.
          for k in preready release cancel locked auth tenant; do
            t="screenshots/real-host-hold-$k-toggle-timing.txt"
            [ -f "$t" ] && { echo "TIMING-BEGIN $k"; cat "$t"; echo; echo "TIMING-END $k"; } || echo "TIMING-MISSING $k"
          done

  # Bounded infrastructure experiment (authorized 19:23): re-run ONLY the two
  # 175 lost shards (media, emoji-real) serially on one runner - one emulator
  # at a time - plus one targeted capture session for the core-ui diagnostic
  # fixtures (swipe-row + radial) whose pixels the emit allowlist now covers.
  # Not a proven contention fix; original 175 artifacts/results preserved.
  retry-media-emoji:
    needs: gate
    if: needs.gate.outputs.retry == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned retry source
        id: pin
        run: |
          # ci/kotlin-retry-trigger.txt: "retry <source-run-id> <archive_sha256>"
          read -r TAG RUN_ID ARCH < ci/kotlin-retry-trigger.txt
          { [ "$TAG" = "retry" ] || [ "$TAG" = "capture-only" ]; } && [ -n "$RUN_ID" ] && [ -n "$ARCH" ] || { echo "Bad retry trigger pin"; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
          echo "mode=$TAG" >> "$GITHUB_OUTPUT"
          echo "RETRY-PIN mode=$TAG run=$RUN_ID archive=$ARCH"
      - name: Restore pinned cumulative candidate source
        run: |
          python3 - <<'PYOVERLAY'
          import base64,hashlib,json,pathlib,zipfile,io,os
          d=pathlib.Path('ci/candidate-overlay')
          m=json.loads((d/'manifest.json').read_text())
          raw=base64.b64decode(''.join(p.read_text().strip() for p in sorted(d.glob('part-*.b64'))),validate=True)
          assert hashlib.sha256(raw).hexdigest()==m['archive_sha256']
          assert m['archive_sha256']==os.environ['PIN_ARCH'], 'overlay archive mismatch vs retry pin'
          z=zipfile.ZipFile(io.BytesIO(raw))
          assert set(z.namelist())==set(m['files'])
          for p in z.infolist():
              n=p.filename; q=pathlib.PurePosixPath(n)
              assert not q.is_absolute() and '..' not in q.parts and not n.startswith('.') and not n.endswith('/')
              assert (n == 'build.gradle.kts' or n.startswith(('app/','ci/','tools/location-map/'))) and '/build/' not in n and '/.env' not in n
              assert (p.external_attr >> 16) & 0o170000 != 0o120000
              data=z.read(p); assert hashlib.sha256(data).hexdigest()==m['files'][n]
              target=pathlib.Path(n); assert not target.is_symlink()
              assert all(not parent.is_symlink() for parent in target.parents)
              target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
          print('CANDIDATE-OVERLAY',m['archive_sha256'],'files',len(m['files']))
          PYOVERLAY
        env:
          PIN_ARCH: ${{ steps.pin.outputs.arch }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - uses: actions/download-artifact@v4
        with:
          name: synthetic-runtime-apk-pair
          path: runtime-apks
          repository: Bandi-maya/chat-application
          run-id: ${{ steps.pin.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify identical runtime APK pair
        run: |
          (cd runtime-apks && sha256sum -c SHA256SUMS)
          cp runtime-apks/SHA256SUMS runtime-apk-pair-SHA256SUMS.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Isolate synthetic emulator backend routing
        run: |
          printf '%s\n' 'REST_API_BASE_URL=http://10.0.2.2:8000' 'WEBSOCKET_URL=ws://10.0.2.2:8000/chat/ws/{userId}' 'TENANT_ID=chat-application' > .env
      - name: Retry media shard (serial emulator 1)
        id: media
        if: steps.pin.outputs.mode == 'retry'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CHATY_TEST_SHARD: media
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-front emulated -camera-back emulated
          script: bash ci/run-smoke.sh
      - name: Preserve media retry results
        if: always() && steps.pin.outputs.mode == 'retry'

        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-results-media-retry
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
      - name: Retry emoji-real shard (serial emulator 2)
        id: emoji
        if: steps.pin.outputs.mode == 'retry'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CHATY_TEST_SHARD: emoji-real
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-front emulated -camera-back emulated
          script: bash ci/run-smoke.sh
      - name: Preserve emoji-real retry results
        if: always() && steps.pin.outputs.mode == 'retry'

        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-results-emoji-real-retry
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
      # Targeted diagnostic captures: five core-ui proof classes whose fixture
      # PNGs the emit allowlist covers (swipe/rtl/radial + the retained header
      # and voice failures; diagnostics are emitted by the tests before their
      # asserts, so failures stay failures). Uses the pinned verified APK pair
      # and the same am-instrument process/component/args/result collection as
      # ci/run-smoke.sh; NO gradle invocation (a rebuild needs cargo-ndk, which
      # this job does not have). Inline one-liner keeps the exit code
      # (emulator-runner splits multi-line scripts). Originals retained.
      - name: Targeted swipe/radial/header/voice diagnostic captures (serial emulator 3)
        id: captures
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-front emulated -camera-back emulated
          script: mkdir -p screenshots && classes="com.example.chat.SwipeRowProofTest,com.example.chat.SwipeRtlAndRowSettingsProofTest,com.example.chat.RadialVariantsProofTest,com.example.chat.HeaderTabStyleSheetProofTest,com.example.chat.VoiceComposerGestureProofTest" && printf '%s\n' "$classes" > screenshots/instrumentation-class-filter.txt && (cd runtime-apks && sha256sum -c SHA256SUMS) && adb install -r -t runtime-apks/app-debug.apk && adb install -r -t runtime-apks/app-debug-androidTest.apk && python3 ci/run-instrumentation-shard.py "$classes" ; rc=$? ; adb pull /sdcard/Android/data/com.example.chat/files/screenshots/. screenshots/ || true ; exit $rc
      - name: Preserve diagnostic capture results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-results-capture-diag-retry
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
      - name: Verify targeted capture selection (5 classes, nonzero cases)
        id: select
        if: always()
        run: |
          python3 - <<'PYSEL'
          import glob, sys, xml.etree.ElementTree as ET, re, pathlib
          want = {'com.example.chat.SwipeRowProofTest','com.example.chat.SwipeRtlAndRowSettingsProofTest','com.example.chat.RadialVariantsProofTest','com.example.chat.HeaderTabStyleSheetProofTest','com.example.chat.VoiceComposerGestureProofTest'}
          # Expected method counts come from the restored pinned source, not from
          # the runner: a crashed runner must not shrink the expectation.
          expected = {}
          for c in sorted(want):
              p = pathlib.Path('app/src/androidTest/java/com/example/chat/' + c.rsplit('.', 1)[-1] + '.kt')
              expected[c] = len(re.findall(r'@Test\b', p.read_text()))
          seen = {}; failures = []; errors = []; integrity = []
          for f in glob.glob('app/build/outputs/androidTest-results/connected/TEST-*.xml'):
              r = ET.parse(f).getroot()
              for tc in r.findall('testcase'):
                  cn = tc.get('classname')
                  if cn == 'shard.integrity':
                      e = tc.find('error')
                      integrity.append(e.text if e is not None and e.text else '')
                      continue
                  seen[cn] = seen.get(cn, 0) + 1
                  if tc.find('failure') is not None: failures.append(cn + '#' + tc.get('name'))
                  if tc.find('error') is not None: errors.append(cn + '#' + tc.get('name'))
          print('CAPTURE-SELECTION completed=%s expected=%s' % (seen, expected))
          print('CAPTURE-TESTFAILURES retained-not-repaired: %s' % failures)
          print('CAPTURE-ERRORS %s' % errors)
          print('CAPTURE-INTEGRITY %s' % integrity)
          hard = []
          missing = sorted(want - set(seen))
          if missing: hard.append('missing classes: %s' % missing)
          for c in sorted(want):
              if c in seen and expected[c] and seen[c] != expected[c]:
                  hard.append('method count mismatch %s: completed=%d expected=%d' % (c, seen[c], expected[c]))
          itext = '\n'.join(integrity)
          for marker in ('INCOMPLETE', 'Runner failed', 'adb exit', 'count-mismatched', 'coverage differs', 'Duplicate'):
              if marker in itext: hard.append('integrity marker: ' + marker)
          if errors: hard.append('test errors (not plain assertions): %s' % errors)
          if hard:
              print('CAPTURE-SELECTION-FAIL ' + '; '.join(hard))
              sys.exit(1)
          print('CAPTURE-SELECTION-OK classes=5 methods-completed=all ordinary-assert-failures=%d (retained, still TEST FAILURE in report)' % len(failures))
          PYSEL
      - name: Upload retry pixel proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-screens-pixel-proof-retry
          path: |
            screenshots/
            runtime-apk-pair-SHA256SUMS.txt
          if-no-files-found: warn
      - name: Emit allowlisted synthetic fixture screenshots (base64)
        if: always()
        run: |
          for n in 31-swipe-light-portrait-closed 31-swipe-light-portrait-progress 31-swipe-light-portrait-after-gesture 31-swipe-light-portrait-open 31-swipe-light-portrait-back-closed 31-swipe-light-portrait-leading 31-swipe-light-portrait-final 31-swipe-real-home-before 31-swipe-real-home-open 31-swipe-real-home-closed 31-swipe-applied-style-0-light-closed 31-swipe-applied-style-0-light-after-gesture 31-swipe-applied-style-0-light-open 31-swipe-applied-style-1-dark-closed 31-swipe-applied-style-1-dark-after-gesture 31-swipe-applied-style-1-dark-open 31-swipe-applied-style-2-light-closed 31-swipe-applied-style-2-light-after-gesture 31-swipe-applied-style-2-light-open 31-swipe-applied-style-3-dark-closed 31-swipe-applied-style-3-dark-after-gesture 31-swipe-applied-style-3-dark-open 31-swipe-applied-style-4-light-closed 31-swipe-applied-style-4-light-after-gesture 31-swipe-applied-style-4-light-open radial-dark-rtl-closed radial-dark-rtl-first-page radial-dark-rtl-first-page-missing radial-dark-rtl-page-2 radial-dark-rtl-page-2-missing radial-dark-rtl-page-3 radial-dark-rtl-page-3-missing radial-dark-rtl-missing-close-semantics 32-swipe-rtl-left-trailing 32-swipe-rtl-production-row-applied 32-swipe-rtl-production-row-reloaded 32-swipe-rtl-production-settings-before-navigation 32-swipe-rtl-production-settings-toggled 32-swipe-rtl-recreated-closed 32-swipe-rtl-right-leading hdr-sheet-light-initial hdr-sheet-light-before-preview-tap hdr-sheet-light-after-preview-tap hdr-sheet-light-selected hdr-sheet-light-scrolled-diag hdr-sheet-light-scrolled hdr-sheet-dark-initial hdr-sheet-dark-before-preview-tap hdr-sheet-dark-after-preview-tap hdr-sheet-dark-selected hdr-sheet-dark-scrolled-diag hdr-sheet-dark-scrolled voice-gesture-tap-toggle-false voice-gesture-tap-toggle-true voice-gesture-drag-cancel-false voice-gesture-drag-cancel-true voice-gesture-drag-locked-false voice-gesture-drag-locked-true voice-gesture-hold-release-false voice-gesture-hold-release-true voice-gesture-locked-delete-false voice-gesture-locked-delete-true voice-gesture-system-cancel-false voice-gesture-system-cancel-true; do
            f="screenshots/$n.png"
            [ -f "$f" ] || { echo "PNGMISSING $n"; continue; }
            sz=$(stat -c %s "$f")
            if [ "$sz" -gt 600000 ]; then echo "PNGSKIP $n size=$sz"; continue; fi
            echo "PNGB64-BEGIN $n $sz"
            base64 -w 0 "$f" | fold -w 4000 | sed 's/^/PNGB64 /'
            echo "PNGB64-END $n"
          done
          for n in hdr-sheet-scroll-light hdr-sheet-last-row-light hdr-sheet-scroll-dark hdr-sheet-last-row-dark; do
            f="screenshots/$n.txt"
            [ -f "$f" ] || { echo "TXTMISSING $n"; continue; }
            sz=$(stat -c %s "$f")
            if [ "$sz" -gt 200000 ]; then echo "TXTSKIP $n size=$sz"; continue; fi
            echo "TXT-BEGIN $n $sz"
            cat "$f"
            echo "TXT-END $n"
          done
      - name: Retry verdict (media failure never hides emoji)
        if: always()
        run: |
          echo "RETRY-OUTCOMES mode=${{ steps.pin.outputs.mode }} media=${{ steps.media.outcome }} emoji-real=${{ steps.emoji.outcome }} captures=${{ steps.captures.outcome }} selection=${{ steps.select.outcome }}"
          if [ "${{ steps.pin.outputs.mode }}" = "capture-only" ]; then
            # Evidence recovery only: retained failures in the five targeted classes
            # are expected and preserved in the derived XML/raw status; selection
            # completeness (5 classes, nonzero cases) is the gate.
            [ "${{ steps.select.outcome }}" = "success" ]
          else
            [ "${{ steps.media.outcome }}" = "success" ] && [ "${{ steps.emoji.outcome }}" = "success" ] && [ "${{ steps.captures.outcome }}" = "success" ] && [ "${{ steps.select.outcome }}" = "success" ]
          fi
