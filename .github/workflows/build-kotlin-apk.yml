name: Build Kotlin APK

on:
  push:
    branches:
      - kotlin
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove Firebase service when google-services.json is absent
        run: |
          if [ ! -f app/google-services.json ]; then
            rm -f app/src/main/java/com/example/chat/notifications/ChatyFirebaseMessagingService.kt
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Rust for MLS native
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mls-native -> target

      - name: Install cargo-ndk and configure ANDROID_NDK_HOME
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi
          NDK_DIR=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK_DIR" ]; then
            echo "::error::Android NDK not found under ANDROID_HOME/ndk"
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Configure release signing keystore
        env:
          CHATY_KEYSTORE_B64: ${{ secrets.CHATY_KEYSTORE_B64 }}
          CHATY_KEYSTORE_PASSWORD: ${{ secrets.CHATY_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ci/keystore
          if [ -n "$CHATY_KEYSTORE_B64" ] && [ -n "$CHATY_KEYSTORE_PASSWORD" ]; then
            printf '%s' "$CHATY_KEYSTORE_B64" | base64 -d > ci/keystore/chaty-release.jks
            echo "CHATY_KEYSTORE_PASSWORD=$CHATY_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::notice::Keystore secrets not set; generating ephemeral CI keystore"
            rm -f ci/keystore/chaty-release.jks
            keytool -genkeypair -v \
              -keystore ci/keystore/chaty-release.jks \
              -alias chaty \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -storepass android \
              -keypass android \
              -dname "CN=Chaty CI, O=Chaty, C=US"
            echo "CHATY_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK output
        id: apk
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK not found at $APK_PATH"
            exit 1
          fi
          APK_SIZE=$(stat -c%s "$APK_PATH")
          APK_SIZE_MB=$(awk "BEGIN { printf \"%.2f\", $APK_SIZE / 1048576 }")
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "size_mb=$APK_SIZE_MB" >> "$GITHUB_OUTPUT"
          echo "Built APK: $APK_PATH (${APK_SIZE_MB} MB / ${APK_SIZE} bytes)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chaty-kotlin-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Send APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || secrets.TELEGRAM_CHAT_ID }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_SIZE: ${{ steps.apk.outputs.size }}
          APK_SIZE_MB: ${{ steps.apk.outputs.size_mb }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHANNEL_ID" ]; then
            echo "::notice::Telegram secrets not configured; skipping Telegram upload"
            exit 0
          fi

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHORT_SHA="${GITHUB_SHA::7}"

          if [ "$APK_SIZE" -le 52000000 ]; then
            CAPTION="Chaty Kotlin Release APK (${APK_SIZE_MB} MB) | ${SHORT_SHA}"
            RESPONSE=$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHANNEL_ID}" \
              -F "document=@${APK_PATH};filename=chaty-${SHORT_SHA}.apk" \
              -F "caption=${CAPTION}")
            echo "$RESPONSE" | jq -e '.ok == true' >/dev/null || {
              echo "::error::Telegram upload failed: $RESPONSE"
              exit 1
            }
          else
            MSG="Chaty Kotlin Release APK built (${APK_SIZE_MB} MB, exceeds Telegram 50 MB bot limit). Download artifact: ${RUN_URL}"
            curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHANNEL_ID}" \
              --data-urlencode "text=${MSG}" >/dev/null
          fi

      - name: Notify failure on Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHANNEL_ID" ]; then
            exit 0
          fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHANNEL_ID}" \
            --data-urlencode "text=Chaty Kotlin APK build failed (${GITHUB_SHA::7}): ${RUN_URL}" >/dev/null || true
