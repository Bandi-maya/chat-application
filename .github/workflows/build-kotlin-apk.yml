name: Build Kotlin APK

on:
  push:
    branches:
      - kotlin
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Compressed Release APK and Send to Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Firebase google-services.json
        id: firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

          if [ -f app/google-services.json ]; then
            jq -e '.. | objects | select(.package_name? == "com.logybyte.chaty")' app/google-services.json >/dev/null || {
              echo "::error::app/google-services.json is invalid JSON or missing package com.logybyte.chaty"
              rm -f app/google-services.json
              exit 1
            }
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Configured Firebase google-services.json for com.logybyte.chaty"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GOOGLE_SERVICES_JSON / GOOGLE_SERVICES_JSON_B64 secret not configured; release APK will build with FCM inactive"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Rust for MLS native
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mls-native -> target

      - name: Install cargo-ndk and configure ANDROID_NDK_HOME
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi
          NDK_DIR=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK_DIR" ]; then
            echo "::error::Android NDK not found under ANDROID_HOME/ndk"
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Configure release signing keystore
        env:
          CHATY_KEYSTORE_B64: ${{ secrets.CHATY_KEYSTORE_B64 }}
          CHATY_KEYSTORE_PASSWORD: ${{ secrets.CHATY_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ci/keystore
          if [ -n "$CHATY_KEYSTORE_B64" ] && [ -n "$CHATY_KEYSTORE_PASSWORD" ]; then
            printf '%s' "$CHATY_KEYSTORE_B64" | base64 -d > ci/keystore/chaty-release.jks
            echo "CHATY_KEYSTORE_PASSWORD=$CHATY_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::notice::Keystore secrets not set; generating ephemeral CI keystore"
            rm -f ci/keystore/chaty-release.jks
            keytool -genkeypair -v \
              -keystore ci/keystore/chaty-release.jks \
              -alias chaty \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -storepass android \
              -keypass android \
              -dname "CN=Chaty CI, O=Chaty, C=US"
            echo "CHATY_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          fi

      - name: Build compressed release APK
        run: gradle :app:assembleRelease -PsplitApks=true --no-daemon

      - name: Select APK & Get Metadata
        id: apk
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/release -type f -name '*arm64-v8a*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            APK_PATH="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          fi
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::No release APK found under app/build/outputs/apk/release"
            exit 1
          fi

          VERSION="$(grep -E '^\s*versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || true)"
          VERSION="${VERSION:-1.0.0}"

          mkdir -p dist
          DEST="dist/chaty-arm64-v8a-release-${VERSION}-build-${GITHUB_RUN_NUMBER}.apk"
          cp "$APK_PATH" "$DEST"
          APK_SIZE="$(stat -c%s "$DEST")"
          APK_SIZE_MB="$(awk "BEGIN { printf \"%.2f\", $APK_SIZE / 1048576 }")"

          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "size_mb=$APK_SIZE_MB" >> "$GITHUB_OUTPUT"
          echo "Selected compressed APK: $DEST (${APK_SIZE_MB} MB / ${APK_SIZE} bytes)"

      - name: Preserve APK in a draft release (no Actions artifact quota)
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          TAG="ci-verified-candidate-${GITHUB_RUN_ID}"
          gh release create "$TAG" --draft --target "$GITHUB_SHA" \
            --title "Chaty candidate ${GITHUB_SHA::7} (verification pending)" \
            --notes "Unpublished candidate. Runtime verification is recorded in the workflow run; do not treat build success as crash verification."
          gh release upload "$TAG" "$APK_PATH"
          gh release view "$TAG" --json url --jq .url | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Send APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || secrets.TELEGRAM_CHAT_ID }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_VERSION: ${{ steps.apk.outputs.version }}
          APK_SIZE: ${{ steps.apk.outputs.size }}
          APK_SIZE_MB: ${{ steps.apk.outputs.size_mb }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHANNEL_ID:-}" ]; then
            echo "::notice::Telegram secrets not configured; skipping Telegram upload"
            exit 0
          fi

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          BRANCH="${GITHUB_REF#refs/heads/}"
          FCM_STATE="off"
          if [ "${{ steps.firebase.outputs.enabled }}" = "true" ]; then
            FCM_STATE="on"
          fi
          TELEGRAM_SINGLE_FILE_LIMIT=52000000
          UPLOAD_PATH="$APK_PATH"
          CAPTION="📱 Chaty | Release APK (${APK_SIZE_MB} MB, arm64-v8a) | v${APK_VERSION} | Build: ${GITHUB_RUN_NUMBER} | Branch: ${BRANCH} | Commit: ${SHORT_SHA} | FCM: ${FCM_STATE}"

          if [ "$APK_SIZE" -gt "$TELEGRAM_SINGLE_FILE_LIMIT" ]; then
            ZIP_PATH="${APK_PATH}.zip"
            zip -j -9 "$ZIP_PATH" "$APK_PATH"
            ZIP_SIZE="$(stat -c%s "$ZIP_PATH")"
            ZIP_SIZE_MB="$(awk "BEGIN { printf \"%.2f\", $ZIP_SIZE / 1048576 }")"
            if [ "$ZIP_SIZE" -le "$TELEGRAM_SINGLE_FILE_LIMIT" ]; then
              UPLOAD_PATH="$ZIP_PATH"
              CAPTION="📱 Chaty | Compressed APK ZIP (${ZIP_SIZE_MB} MB, arm64-v8a) | v${APK_VERSION} | Build: ${GITHUB_RUN_NUMBER} | Commit: ${SHORT_SHA} | FCM: ${FCM_STATE}"
            else
              MSG="Chaty Release APK built (${APK_SIZE_MB} MB, compressed ${ZIP_SIZE_MB} MB — exceeds Telegram 50 MB limit). APK preserved in draft release for authorized reviewers. Run: ${RUN_URL}"
              curl --fail --silent --show-error --retry 2 \
                -d "chat_id=${TELEGRAM_CHANNEL_ID}" \
                --data-urlencode "text=${MSG}" \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" >/dev/null
              exit 0
            fi
          fi

          RESPONSE="$(curl --fail --silent --show-error --retry 3 --retry-all-errors \
            -F "chat_id=${TELEGRAM_CHANNEL_ID}" \
            -F "document=@${UPLOAD_PATH}" \
            -F "caption=${CAPTION}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument")"
          echo "$RESPONSE" | jq -e '.ok == true' >/dev/null || {
            echo "::error::Telegram upload failed: $RESPONSE"
            exit 1
          }
          echo "Telegram confirmed delivery of ${UPLOAD_PATH}."

      - name: Clean up Firebase config file
        if: always()
        run: rm -f app/google-services.json

      - name: Notify failure on Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHANNEL_ID:-}" ]; then
            exit 0
          fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl --fail --silent --show-error --retry 2 \
            -d "chat_id=${TELEGRAM_CHANNEL_ID}" \
            --data-urlencode "text=❌ Chaty Android release build failed (${GITHUB_SHA::7}): ${RUN_URL}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" >/dev/null || true


  chat-open-emulator:
    name: Release chat-open probe (x86_64, offline demo)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Firebase google-services.json
        id: firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

          if [ -f app/google-services.json ]; then
            jq -e '.. | objects | select(.package_name? == "com.logybyte.chaty")' app/google-services.json >/dev/null || {
              echo "::error::app/google-services.json is invalid JSON or missing package com.logybyte.chaty"
              rm -f app/google-services.json
              exit 1
            }
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Configured Firebase google-services.json for com.logybyte.chaty"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GOOGLE_SERVICES_JSON / GOOGLE_SERVICES_JSON_B64 secret not configured; release APK will build with FCM inactive"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Rust for MLS native
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mls-native -> target

      - name: Install cargo-ndk and configure ANDROID_NDK_HOME
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi
          NDK_DIR=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK_DIR" ]; then
            echo "::error::Android NDK not found under ANDROID_HOME/ndk"
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Configure release signing keystore
        env:
          CHATY_KEYSTORE_B64: ${{ secrets.CHATY_KEYSTORE_B64 }}
          CHATY_KEYSTORE_PASSWORD: ${{ secrets.CHATY_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ci/keystore
          if [ -n "$CHATY_KEYSTORE_B64" ] && [ -n "$CHATY_KEYSTORE_PASSWORD" ]; then
            printf '%s' "$CHATY_KEYSTORE_B64" | base64 -d > ci/keystore/chaty-release.jks
            echo "CHATY_KEYSTORE_PASSWORD=$CHATY_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::notice::Keystore secrets not set; generating ephemeral CI keystore"
            rm -f ci/keystore/chaty-release.jks
            keytool -genkeypair -v \
              -keystore ci/keystore/chaty-release.jks \
              -alias chaty \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -storepass android \
              -keypass android \
              -dname "CN=Chaty CI, O=Chaty, C=US"
            echo "CHATY_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          fi

      - name: Build compressed release APK
        run: gradle :app:assembleRelease -PsplitApks=true --no-daemon


      - name: Select matching x86_64 release for the emulator
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/release -type f -name '*x86_64*.apk' -print -quit)"
          test -n "$APK_PATH" && test -f "$APK_PATH"
          mkdir -p emulator-apk
          cp "$APK_PATH" emulator-apk/chaty-x86_64-release.apk
          sha256sum emulator-apk/chaty-x86_64-release.apk
          echo "The phone artifact remains arm64. This separate release build uses the same commit for the x86_64 emulator."

      - name: Enable KVM on the free Linux GitHub-hosted runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open existing and cleared-empty demo chats, three times each
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 ci/chat-open-release-probe.py emulator-apk/chaty-x86_64-release.apk

      - name: Record probe verdict and coverage limits
        if: always()
        run: |
          echo '## Chat-open emulator probe' >> "$GITHUB_STEP_SUMMARY"
          echo 'API 35 x86_64 release, synthetic offline demo only. Not an arm64 device reproduction.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Existing demo chat and cleared-empty demo chat: three opens each. Brand-new contact route is NOT tested (requires authorized account/recipient).' >> "$GITHUB_STEP_SUMMARY"
          if [ -f chat-open-evidence/verdict.json ]; then
            cat chat-open-evidence/verdict.json | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'Probe did not produce a verdict; setup/build/emulator failure is not a chat-crash diagnosis.' | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve emulator evidence in the same draft release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILES=()
          for DIR in chat-open-evidence emulator-apk; do
            if [ -d "$DIR" ]; then FILES+=("$DIR"); fi
          done
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo 'No emulator evidence exists; setup/build failed before capture.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          zip -q -r chat-open-emulator-evidence-x86_64.zip "${FILES[@]}"
          gh release upload "ci-verified-candidate-${GITHUB_RUN_ID}" chat-open-emulator-evidence-x86_64.zip
          gh release view "ci-verified-candidate-${GITHUB_RUN_ID}" --json url --jq .url | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Clean up emulator-job Firebase config file
        if: always()
        run: rm -f app/google-services.json
