{"name": "Diagnostics (analyze+tests only)", "on": {"workflow_dispatch": {}, "push": {"branches": ["themes"], "paths": [".github/workflows/diag.yml"]}}, "permissions": {"contents": "read"}, "jobs": {"d": {"runs-on": "ubuntu-latest", "timeout-minutes": 20, "steps": [{"uses": "actions/checkout@v4"}, {"uses": "subosito/flutter-action@v2", "with": {"channel": "stable", "cache": true}}, {"name": "Analyze touched files", "continue-on-error": true, "run": "touch .env; flutter pub get >/dev/null; flutter analyze --no-fatal-infos lib/features/chats/chat_detail_screen.dart lib/features/messages/attachment_sheet.dart lib/core/emoji lib/ui/core/ticks lib/ui/core/bubbles lib/features/settings/settings_root_screen.dart lib/features/settings/conversation/conversation_bubble_and_ticks_screen.dart lib/features/settings/home lib/features/chats/chats_home_screen.dart lib/domain/models/preferences.dart > an.txt 2>&1; { echo '## ANALYZE'; grep -E '(error|warning) \u2022|issues found|No issues' an.txt | head -40; } >> $GITHUB_STEP_SUMMARY"}, {"name": "Story look tests and render", "continue-on-error": true, "run": "touch .env; flutter test test/chaty_story_tile_test.dart test/bubble_catalog_roundtrip_test.dart test/tick_catalog_roundtrip_test.dart > tt.txt 2>&1; { echo '## TESTS'; grep -vE '^\\s*$' tt.txt | grep -E 'EXCEPTION|Expected|Actual|\\[E\\]|Some tests|All tests|\\.dart:[0-9]+|[0-9]+:[0-9]+ \\+' | tail -40; } >> $GITHUB_STEP_SUMMARY"}]}}}
