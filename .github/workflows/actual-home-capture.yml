name: Exact APK real-account Home capture
on:
  push:
    branches: [testref/actual-home-nov6]
    paths: [.github/workflows/actual-home-capture.yml]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chaty-app-debug-apk
          path: apk
          run-id: 42213727153
          repository: Bandi-maya/chat-application
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Record exact artifact
        run: |
          mkdir -p evidence
          sha256sum apk/app-debug.apk > evidence/apk-sha256.txt
          AAPT=$(ls "$ANDROID_HOME/build-tools/"*/aapt | sort -V | tail -1)
          "$AAPT" dump badging apk/app-debug.apk > /tmp/apk-badging.txt
          awk -F"'" '/^package: name=/ {print "TEST_PACKAGE=" $2}' /tmp/apk-badging.txt >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare bounded capture script
        run: |
          cat > /tmp/capture.py <<'PY'
          import os,pathlib,subprocess,time,re,xml.etree.ElementTree as ET
          out=pathlib.Path('evidence');out.mkdir(exist_ok=True)
          def adb(*args):
           r=subprocess.run(['adb',*args],stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=45)
           if r.returncode:raise RuntimeError('Device command failed; arguments withheld')
           return r.stdout
          def nodes():
           for attempt in range(3):
            try:
             adb('shell','rm','-f','/sdcard/view.xml')
             adb('shell','uiautomator','dump','/sdcard/view.xml')
             return list(ET.fromstring(adb('shell','cat','/sdcard/view.xml')).iter('node'))
            except (RuntimeError,ET.ParseError):
             if attempt==2:raise
             time.sleep(2)
          def tap(n):
           b=list(map(int,re.findall(r'\d+',n.get('bounds',''))));adb('shell','input','tap',str((b[0]+b[2])//2),str((b[1]+b[3])//2))
          def match(text):
           for n in nodes():
            if n.get('text')==text or n.get('content-desc')==text:return n
           return None
          def click(text):
           n=match(text)
           if n is None:raise RuntimeError('Expected control missing: '+text)
           tap(n)
          def wait(text,secs=30):
           launcher_closed=False
           for _ in range(secs//2):
            if match("Pixel Launcher isn't responding") is not None:
             click('Wait');launcher_closed=True;time.sleep(2)
            if match(text) is not None:return
            time.sleep(2)
           raise RuntimeError('Expected screen missing: '+text)
          def capture(name):
           (out/(name+'.png')).write_bytes(adb('exec-out','screencap','-p'))
          def scroll():adb('shell','input','swipe','540','1700','540','650','500')
          activity=adb('shell','cmd','package','resolve-activity','--brief',os.environ['TEST_PACKAGE']).decode().strip().splitlines()[-1]
          if '/' not in activity:raise RuntimeError('Launcher activity not resolved')
          adb('shell','am','start','-n',activity)
          time.sleep(3);capture('00-blank-entry')
          try:wait('Register',60)
          except RuntimeError:
           capture('00-blank-entry-failed')
           try:(out/'00-blank-entry.xml').write_bytes(adb('shell','cat','/sdcard/view.xml'))
           except RuntimeError:pass
           raise
          wait('Log In',60);click('Log In');wait('Email or username',30);time.sleep(1)
          capture('00-blank-login')
          click('Try the demo');time.sleep(15)
          capture('00-first-run-prompts')
          for control in ['Not now','Close','Not Now']:
           if match(control) is not None:click(control);time.sleep(2)
          ns=nodes()
          if any(n.get('class')=='android.widget.EditText' and n.get('password')=='true' for n in ns):
           capture('01-demo-entry-result')
           (out/'status.txt').write_text('Try the demo tapped once; still on auth. No credentials entered.')
           raise RuntimeError('Demo did not reach Home')
          (out/'01-demo-screen.xml').write_bytes(adb('shell','cat','/sdcard/view.xml'))
          # Capture only after password fields are absent; error captures must never reveal inputs.
          ns=nodes()
          if any(n.get('class')=='android.widget.EditText' and n.get('password')=='true' for n in ns):
           # Do not dump errors that could echo request bodies. Report generic blocked state only.
           (out/'status.txt').write_text('Registration did not reach Home. No second submit. No auth screenshots or hierarchy uploaded. Verification or error needs private review.')
           raise RuntimeError('Registration did not reach Home')
          labels=[n.get('text','') for n in ns]
          if any(n.get('password')=='true' for n in ns):
           (out/'status.txt').write_text('Post-registration screen not recognized as Chats Home; capture withheld to avoid unexpected account state.')
           raise RuntimeError('Home not established')
          capture('01-actual-home-fullscreen')
          adb('shell','am','force-stop',os.environ['TEST_PACKAGE']);adb('shell','monkey','-p',os.environ['TEST_PACKAGE'],'-c','android.intent.category.LAUNCHER','1');time.sleep(12)
          for control in ['Not now','Close','Not Now']:
           if match(control) is not None:click(control);time.sleep(2)
          capture('02-actual-home-reopened')
          # Open sample chat and inspect only. Never send, call, share or modify settings.
          def snap(name):
           capture(name)
           nodes()
           (out/(name+'.xml')).write_bytes(adb('shell','cat','/sdcard/view.xml'))
          try:
           click('Aisha (sample)');time.sleep(4);snap('03-actual-conversation')
           click('Chat options');time.sleep(2);snap('04-actual-chat-options')
           adb('shell','input','keyevent','4');time.sleep(1)
           opened=False
           for label in ['Attach','Attachment','Attachments','Add attachment']:
            if match(label) is not None:click(label);opened=True;break
           if not opened:
            snap('05-attachment-control-not-found')
           else:
            time.sleep(3);snap('05-actual-attachment-sheet')
           (out/'status.txt').write_text('Current kotlin APK; built-in offline demo. Opened chat and options, attempted attachment sheet. No messages, calls or shares sent. No app code/build.')
          except Exception as e:
           snap('09-navigation-blocked');(out/'status.txt').write_text('Read-only demo navigation blocked: '+str(e))
           raise
          finally:
           adb('shell','rm','-f','/sdcard/view.xml')
          PY
      - name: Capture user-selected built-in demo Home
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb install apk/app-debug.apk > /tmp/install.txt 2>&1
            python3 /tmp/capture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-home-fullscreen-evidence
          path: evidence/
          retention-days: 1
          if-no-files-found: error
