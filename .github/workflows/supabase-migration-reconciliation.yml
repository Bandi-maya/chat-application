name: Supabase Migration Reconciliation

on:
  push:
    branches:
      - production-hardening-2026-08-22
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-canonical-history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate versions and production-derived checksums
        shell: bash
        run: bash tools/check_migration_versions.sh

  clean-database-replay:
    needs: validate-canonical-history
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Initialize local Supabase configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi
          supabase --version

      - name: Start clean local Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          supabase start

      - name: Replay all migrations from zero
        shell: bash
        run: |
          set -euo pipefail
          supabase db reset --local

      - name: Verify schema, RLS, storage, realtime and E2EE invariants
        shell: bash
        run: |
          set -euo pipefail
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
            --set ON_ERROR_STOP=1 \
            --file tools/verify_supabase_schema.sql

      - name: Stop local Supabase stack
        if: always()
        shell: bash
        run: supabase stop --no-backup || true
