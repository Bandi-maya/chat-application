name: Supabase Migration Reconciliation

on:
  push:
    branches:
      - production-hardening-2026-08-22
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  sync-canonical-history:
    if: >-
      github.event_name == 'push' &&
      !contains(github.event.head_commit.message, 'chore: sync canonical Supabase migration history')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OIDC_AUDIENCE: chaty-supabase-migration-export
      EXPORT_URL: https://dntnxeanubswyswahdnj.supabase.co/functions/v1/migration-history-export-temp
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v6
        with:
          ref: production-hardening-2026-08-22
          fetch-depth: 0

      - name: Check whether canonical history is already pinned
        id: canonical
        shell: bash
        run: |
          set +e
          bash tools/check_migration_versions.sh
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Request short-lived GitHub OIDC token
        if: steps.canonical.outputs.ready != 'true'
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          test -n "$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Export retained production migration history
        if: steps.canonical.outputs.ready != 'true'
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Accept: application/json' \
            "$EXPORT_URL" \
            -o /tmp/chaty-migration-history.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path('/tmp/chaty-migration-history.json')
          history = json.loads(source.read_text(encoding='utf-8'))
          if not isinstance(history, list) or len(history) != 45:
              raise SystemExit(f'Expected exactly 45 production migrations, got {len(history) if isinstance(history, list) else "non-list"}')

          root = Path('supabase/migrations')
          root.mkdir(parents=True, exist_ok=True)
          for existing in root.glob('*.sql'):
              existing.unlink()

          seen = set()
          for row in history:
              version = str(row.get('version', ''))
              name = str(row.get('name', ''))
              sql = row.get('sql')
              if len(version) != 14 or not version.isdigit():
                  raise SystemExit(f'Invalid migration version: {version!r}')
              if version in seen:
                  raise SystemExit(f'Duplicate migration version: {version}')
              seen.add(version)
              if not name or any(ch not in 'abcdefghijklmnopqrstuvwxyz0123456789_' for ch in name):
                  raise SystemExit(f'Unsafe migration name: {name!r}')
              if not isinstance(sql, str) or not sql.strip():
                  raise SystemExit(f'Migration {version}_{name} has empty SQL')
              path = root / f'{version}_{name}.sql'
              path.write_text(sql.rstrip() + '\n', encoding='utf-8')

          ordered = sorted(seen)
          if ordered[0] != '20260819064501' or ordered[-1] != '20260822131153':
              raise SystemExit(f'Unexpected migration bounds: {ordered[0]}..{ordered[-1]}')
          print(f'Wrote {len(seen)} canonical production migration files.')
          PY

      - name: Validate canonical migration history
        shell: bash
        run: bash tools/check_migration_versions.sh

      - name: Commit canonical migration history
        if: steps.canonical.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- supabase/migrations; then
            echo 'Migration history already matches production.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations
          git commit -m 'chore: sync canonical Supabase migration history'
          git push origin HEAD:production-hardening-2026-08-22

  validate-canonical-history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate versions and production-derived checksums
        shell: bash
        run: bash tools/check_migration_versions.sh

  clean-database-replay:
    needs: validate-canonical-history
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Initialize local Supabase configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi
          supabase --version

      - name: Start clean local Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          supabase start

      - name: Replay all migrations from zero
        shell: bash
        run: |
          set -euo pipefail
          supabase db reset --local

      - name: Verify schema, RLS, storage, realtime and E2EE invariants
        shell: bash
        run: |
          set -euo pipefail
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
            --set ON_ERROR_STOP=1 \
            --file tools/verify_supabase_schema.sql

      - name: Stop local Supabase stack
        if: always()
        shell: bash
        run: supabase stop --no-backup || true
