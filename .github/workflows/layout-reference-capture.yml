name: Manual isolated layout capture
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Build run containing synthetic-runtime-apk-pair
        required: true
        default: '41618557841'
  push:
    branches: [kotlin]
    paths:
      - ci/layout-capture-trigger.txt
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: synthetic-runtime-apk-pair
          path: runtime-apks
          run-id: ${{ inputs.source_run || '41618557841' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify immutable isolated pair
        run: cd runtime-apks && sha256sum -c SHA256SUMS
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 ci/layout-reference-capture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-capture-${{ inputs.source_run || '41618557841' }}
          path: screenshots/
          if-no-files-found: error
