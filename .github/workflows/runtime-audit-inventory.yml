name: Chaty Runtime Audit Inventory

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feat/global-template-customization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-inventory:
    name: Discover screens and interaction candidates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go for workflow linting
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Lint all GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: qa/playwright/package.json

      - name: Install Playwright audit dependencies
        working-directory: qa/playwright
        run: npm install

      - name: Type-check Playwright audit
        working-directory: qa/playwright
        run: npx tsc -p tsconfig.json --noEmit

      - name: Validate Playwright test discovery
        working-directory: qa/playwright
        run: npx playwright test --config=playwright.config.ts --list

      - name: Generate source inventory
        run: python3 tools/qa/generate_screen_inventory.py --output artifacts/source-screen-inventory.md

      - name: Upload inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: chaty-source-screen-inventory
          path: artifacts/source-screen-inventory.md
          if-no-files-found: error
          retention-days: 14
