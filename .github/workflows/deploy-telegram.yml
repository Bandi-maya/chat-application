name: Build and Deploy Kotlin APK to Telegram

on:
  push:
    branches:
      - kotlin
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-send:
    name: Build Android APK & Send to Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --no-daemon
          else
            gradle :app:assembleDebug --no-daemon
          fi

      - name: Locate APK & Get Metadata
        id: apk-info
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found!"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_filename=$(basename "$APK_PATH")" >> "$GITHUB_OUTPUT"
          echo "Found APK at $APK_PATH"
          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH"

      - name: Upload APK as Pipeline Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chaty-app-debug-apk
          path: ${{ steps.apk-info.outputs.apk_path }}
          retention-days: 7

      - name: Send APK to Telegram
        if: success()
        run: |
          APK_PATH="${{ steps.apk-info.outputs.apk_path }}"
          APP_NAME="Chaty Android App (Kotlin)"
          VERSION="1.0.0"
          COMMIT_SHA="${GITHUB_SHA::7}"
          BRANCH="${GITHUB_REF#refs/heads/}"

          CAPTION="📦 ${APP_NAME}
          🏷️ Version: ${VERSION}
          ⚙️ Build: ${GITHUB_RUN_NUMBER}
          🌿 Branch: ${BRANCH}
          🔗 Commit: ${COMMIT_SHA}
          ✅ Status: Built Successfully
          🕒 Time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          TELEGRAM_CHAT="${{ secrets.TELEGRAM_CHANNEL_ID }}"
          if [ -z "$TELEGRAM_CHAT" ]; then
            TELEGRAM_CHAT="${{ secrets.TELEGRAM_CHAT_ID }}"
          fi

          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "$TELEGRAM_CHAT" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
              -F chat_id="$TELEGRAM_CHAT" \
              -F document=@"$APK_PATH" \
              -F caption="$CAPTION"
            echo "APK successfully sent to Telegram."
          else
            echo "TELEGRAM_BOT_TOKEN and TELEGRAM_CHANNEL_ID/TELEGRAM_CHAT_ID secrets not configured; skipping Telegram delivery."
          fi

      - name: Send Failure Notification to Telegram
        if: failure()
        run: |
          COMMIT_SHA="${GITHUB_SHA::7}"
          BRANCH="${GITHUB_REF#refs/heads/}"

          MESSAGE="❌ Chaty Android APK build FAILED
          🌿 Branch: ${BRANCH}
          🔗 Commit: ${COMMIT_SHA}
          ⚙️ Run ID: ${GITHUB_RUN_ID}
          Check GitHub Actions for details."

          TELEGRAM_CHAT="${{ secrets.TELEGRAM_CHANNEL_ID }}"
          if [ -z "$TELEGRAM_CHAT" ]; then
            TELEGRAM_CHAT="${{ secrets.TELEGRAM_CHAT_ID }}"
          fi

          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "$TELEGRAM_CHAT" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT" \
              -d text="$MESSAGE"
          fi
