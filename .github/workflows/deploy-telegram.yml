            app/src/main/kotlin/com/example/chat/ui/media/ChatyVideoPlayerWidget.kt \
            app/src/main/kotlin/com/example/chat/ui/updates/UpdatesScreenParts.kt \
            app/src/main/java/com/example/chat/data/services/AndroidVoiceNoteAdapters.kt \
            app/src/main/java/com/example/chat/data/network/NetworkStatusMonitor.kt \
            app/src/main/java/com/example/chat/data/network/TransferMonitor.kt \
            app/src/main/java/com/example/chat/data/network/AppTrafficMonitor.kt \
            app/src/main/java/com/example/chat/data/api/ApiMediaUploadClient.kt \
            app/src/main/java/com/example/chat/data/remote/SupabaseStorageClient.kt \
            app/src/main/java/com/example/chat/data/media/BoundedMediaDownloader.kt \
            app/src/main/java/com/example/chat/data/services/ChatMediaService.kt \
            app/src/main/java/com/example/chat/data/services/CallSignalingService.kt \
            app/src/main/java/com/example/chat/data/services/SessionLifecycleService.kt \
            app/src/main/kotlin/com/example/chat/ui/chats/home/ConversationRow.kt \
            app/src/main/java/com/example/chat/data/services/WebRtcCallMediaController.kt \
            app/src/main/java/com/example/chat/data/transfer/NativeP2pTransferProtocol.kt \
            app/src/main/java/com/example/chat/data/transfer/ChunkReceiptLedger.kt \
            app/src/main/java/com/example/chat/data/transfer/P2pFileTransferService.kt \
            app/src/test/java/com/example/chat/data/transfer/NativeP2pTransferProtocolTest.kt \
            app/src/main/kotlin/com/example/chat/ui/chats/detail/ConnectionDetailSheet.kt \
            app/src/main/res/xml/file_paths.xml \
            app/src/main/kotlin/com/example/chat/data/api/ApiBackendService.kt \
            app/src/main/java/com/example/chat/data/api/ApiRealtimeClient.kt \
            app/src/main/java/com/example/chat/data/api/ApiCallSignalClient.kt \
            app/src/main/java/com/example/chat/data/messaging/ConversationsRepository.kt \
            app/src/main/kotlin/com/example/chat/ui/ChatVoiceBinding.kt \
            app/src/main/kotlin/com/example/chat/ui/chats/detail/VoiceNoteController.kt \
            app/src/main/kotlin/com/example/chat/ServiceLocator.kt \
            app/src/main/kotlin/com/example/chat/ui/AppRoot.kt \
            app/src/main/java/com/example/chat/domain/models/ChatMessage.kt \
            app/src/main/kotlin/com/example/chat/ui/ChatDetailHost.kt \
            app/src/main/kotlin/com/example/chat/ui/chats/ChatDetailScreen.kt \
            app/src/main/kotlin/com/example/chat/ui/chats/detail/MessageBubble.kt \
            app/src/main/kotlin/com/example/chat/ui/updates/ReleaseNotesPolicy.kt \
            app/src/main/kotlin/com/example/chat/ui/navigation/NavigationShells3.kt \
            app/src/main/kotlin/com/example/chat/ui/navigation/MainNavigationShell.kt \
