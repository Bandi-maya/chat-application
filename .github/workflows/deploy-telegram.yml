            app/src/main/kotlin/com/example/chat/ui/settings/notifications/NotificationSettingsPage.kt \
            app/src/main/kotlin/com/example/chat/ui/kit/GbDesignSystem.kt \
            app/src/debug/java/com/example/chat/LockBadgeProofActivity.kt \
            app/src/main/kotlin/com/example/chat/data/api/EncryptedApiSessionStore.kt \
            app/src/main/kotlin/com/example/chat/data/auth/EncryptedGoTrueSessionStorage.kt \
            app/src/main/kotlin/com/example/chat/data/auth/SessionStore.kt \
            app/src/main/kotlin/com/example/chat/data/auth/AuthRepository.kt \
            app/src/main/java/com/example/chat/data/api/ApiSessionStore.kt \
            app/src/main/java/com/example/chat/data/services/AacPcmVoiceRecorder.kt \
            app/src/main/kotlin/com/example/chat/ui/chats/detail/VoiceSessionController.kt \
            app/src/main/kotlin/com/example/chat/ui/ChatAttachmentsBinding.kt \
            app/src/main/kotlin/com/example/chat/ui/media/MediaLibraryService.kt \
            app/src/main/kotlin/com/example/chat/ui/media/MediaWorkspaceScreen.kt \
            app/src/main/kotlin/com/example/chat/ui/media/PdfWorkspaceScreen.kt \
            app/src/main/kotlin/com/example/chat/ui/media/MediaWorkspaceHost.kt \
            app/src/test/java/com/example/chat/LocalLockServiceFullTest.kt \
            app/src/test/java/com/example/chat/ProtectedResourceGateParityTest.kt \
            app/src/test/java/com/example/chat/ui/media/MediaLibraryServiceHardeningTest.kt \
            gradle.properties

      - name: Disable unused Firebase messaging entrypoint
        run: rm -f app/src/main/java/com/example/chat/notifications/ChatyFirebaseMessagingService.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            mls-native -> target
          cache-on-failure: true

      - name: Install cargo-ndk
        run: |
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked

      - name: Set Android NDK for cargo-ndk
        run: |
          NDK=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            echo "Installing NDK via sdkmanager..."
            echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;25.2.9519653" || true
            NDK=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          fi
          echo "Found Android NDK: $NDK"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

      - name: Materialize or generate Chaty signing keystore
        env:
          CHATY_KEYSTORE_B64: ${{ secrets.CHATY_KEYSTORE_B64 }}
          CHATY_KEYSTORE_PASSWORD: ${{ secrets.CHATY_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ci/keystore
          if [ -n "${CHATY_KEYSTORE_B64:-}" ] && [ -n "${CHATY_KEYSTORE_PASSWORD:-}" ]; then
            printf '%s' "$CHATY_KEYSTORE_B64" | base64 -d > ci/keystore/chaty-release.jks
            chmod 600 ci/keystore/chaty-release.jks
            echo "CHATY_KEYSTORE_PASSWORD=$CHATY_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Materialized Chaty release keystore from secrets."
          else
            keytool -genkeypair -v -keystore ci/keystore/chaty-release.jks \
              -alias chaty -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Chaty, OU=Dev, O=Chaty, L=Unknown, S=Unknown, C=US"
            echo "CHATY_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "Generated fallback debug keystore for Chaty build."
          fi

      - name: Generate UniFFI bindings
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:generateUniffiBindings --no-daemon || true
          else
            gradle :app:generateUniffiBindings --no-daemon || true
          fi

      - name: Build Debug APK
        run: |
          if command -v cargo-ndk >/dev/null && [ -n "$ANDROID_NDK_HOME" ]; then
            echo "Building with native OpenMLS (cargo-ndk)..."
            if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
              ./gradlew :app:assembleDebug --no-daemon
            else
              gradle :app:assembleDebug --no-daemon
            fi
          else
            echo "cargo-ndk or NDK missing; falling back to -PskipMlsNative=true..."
            if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
              ./gradlew :app:assembleDebug -PskipMlsNative=true --no-daemon
            else
              gradle :app:assembleDebug -PskipMlsNative=true --no-daemon
            fi
          fi

      - name: Locate APK & Get Metadata
        id: apk-info
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found!"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_filename=$(basename "$APK_PATH")" >> "$GITHUB_OUTPUT"
          echo "Found APK at $APK_PATH"
          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH"

      - name: Upload APK as Pipeline Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chaty-app-debug-apk
          path: ${{ steps.apk-info.outputs.apk_path }}
          retention-days: 7

      - name: Send APK to Telegram
        if: success()
        run: |
          APK_PATH="${{ steps.apk-info.outputs.apk_path }}"
          APP_NAME="Chaty Android App (Kotlin)"
          VERSION="1.0.0"
          COMMIT_SHA="${GITHUB_SHA::7}"
          BRANCH="${GITHUB_REF#refs/heads/}"

          CAPTION="📦 ${APP_NAME}
          🏷️ Version: ${VERSION}
          ⚙️ Build: ${GITHUB_RUN_NUMBER}
          🌿 Branch: ${BRANCH}
          🔗 Commit: ${COMMIT_SHA}
          ✅ Status: Built Successfully
          🕒 Time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          TELEGRAM_CHAT="${{ secrets.TELEGRAM_CHANNEL_ID }}"
          if [ -z "$TELEGRAM_CHAT" ]; then
            TELEGRAM_CHAT="${{ secrets.TELEGRAM_CHAT_ID }}"
          fi

          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "$TELEGRAM_CHAT" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
              -F chat_id="$TELEGRAM_CHAT" \
              -F document=@"$APK_PATH" \
              -F caption="$CAPTION"
            echo "APK successfully sent to Telegram."
          else
            echo "TELEGRAM_BOT_TOKEN and TELEGRAM_CHANNEL_ID/TELEGRAM_CHAT_ID secrets not configured; skipping Telegram delivery."
          fi

      - name: Send Failure Notification to Telegram
        if: failure()
        run: |
          COMMIT_SHA="${GITHUB_SHA::7}"
          BRANCH="${GITHUB_REF#refs/heads/}"

          MESSAGE="❌ Chaty Android APK build FAILED
          🌿 Branch: ${BRANCH}
          🔗 Commit: ${COMMIT_SHA}
          ⚙️ Run ID: ${GITHUB_RUN_ID}
          Check GitHub Actions for details."

          TELEGRAM_CHAT="${{ secrets.TELEGRAM_CHANNEL_ID }}"
          if [ -z "$TELEGRAM_CHAT" ]; then
            TELEGRAM_CHAT="${{ secrets.TELEGRAM_CHAT_ID }}"
          fi

          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "$TELEGRAM_CHAT" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT" \
              -d text="$MESSAGE"
          fi
