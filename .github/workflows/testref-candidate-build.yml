      - name: Verify targeted capture selection (nonzero cases)
        id: select
        if: always()
        env:
          SELECT_WANT: ${{ steps.pin.outputs.select_want }}
          SELECT_EXCLUDED: ${{ steps.pin.outputs.select_excluded }}
        run: |
          python3 - <<'PYSEL'
          import glob, os, sys, xml.etree.ElementTree as ET, re, pathlib
          want = set(x for x in os.environ.get('SELECT_WANT', '').split(',') if x)
          # Expected method counts come from the restored pinned source, not from
          # the runner: a crashed runner must not shrink the expectation.
          excluded = set(x for x in os.environ.get('SELECT_EXCLUDED', '').split(',') if x)
          for e in sorted(excluded):
              print('CAPTURE-EXCLUSION diagnostic-not-accepted: ' + e)
          # Exact method identities from pinned source; count alone must not hide a swapped method.
          expected = {}
          for c in sorted(want):
              rel = 'app/src/androidTest/java/com/example/chat/' + c.rsplit('.', 1)[-1] + '.kt'
              p = pathlib.Path(rel)
              if not p.exists():
                  # Override-only (gb-parity shadow) classes are absent from the restored
                  # overlay tree; the overlay manifest carries zero gb-parity entries, so the
                  # branch checkout's override dir is the authoritative compiled source.
                  p = pathlib.Path('ci/gb-parity-overrides') / rel
              names = re.findall(r'@Test\s+fun\s+(\w+)', p.read_text())
              assert len(names) == len(re.findall(r'@Test\b', p.read_text())), c
              expected[c] = sorted(n for n in names if c + '#' + n not in excluded)
          seen = {}; seen_methods = {}; failures = []; errors = []; integrity = []
          for f in glob.glob('app/build/outputs/androidTest-results/connected/TEST-*.xml'):
              r = ET.parse(f).getroot()
              for tc in r.findall('testcase'):
                  cn = tc.get('classname')
                  if cn == 'shard.integrity':
                      e = tc.find('error')
                      integrity.append(e.text if e is not None and e.text else '')
                      continue
                  seen[cn] = seen.get(cn, 0) + 1
                  seen_methods.setdefault(cn, []).append(tc.get('name'))
                  if tc.find('failure') is not None: failures.append(cn + '#' + tc.get('name'))
                  if tc.find('error') is not None: errors.append(cn + '#' + tc.get('name'))
          print('CAPTURE-SELECTION completed=%s expected=%s' % (seen, expected))
          print('CAPTURE-TESTFAILURES retained-not-repaired: %s' % failures)
          print('CAPTURE-ERRORS %s' % errors)
          print('CAPTURE-INTEGRITY %s' % integrity)
          hard = []
          missing = sorted(want - set(seen))
          if missing: hard.append('missing classes: %s' % missing)
          for c in sorted(want):
              if c in seen:
                  missing = sorted(set(expected[c]) - set(seen_methods.get(c, [])))
                  extra = sorted(set(seen_methods.get(c, [])) - set(expected[c]))
                  if missing: hard.append('missing methods %s: %s' % (c, missing))
                  if extra: hard.append('unexpected methods %s: %s' % (c, extra))
          itext = '\n'.join(integrity)
          for marker in ('INCOMPLETE', 'Runner failed', 'adb exit', 'count-mismatched', 'coverage differs', 'Duplicate'):
              if marker in itext: hard.append('integrity marker: ' + marker)
          if errors: hard.append('test errors (not plain assertions): %s' % errors)
          if hard:
              print('CAPTURE-SELECTION-FAIL ' + '; '.join(hard))
              sys.exit(1)
          print('CAPTURE-SELECTION-OK classes=%d methods-completed=all ordinary-assert-failures=%d (retained, still TEST FAILURE in report)' % (len(want), len(failures)))
