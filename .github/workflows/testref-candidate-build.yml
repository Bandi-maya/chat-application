      - uses: actions/download-artifact@v4
        with:
          name: synthetic-runtime-apk-pair
          path: runtime-apks
      - name: Verify isolated pair
        run: cd runtime-apks && sha256sum -c SHA256SUMS
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-call.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 ci/emulator-preflight.py && python3 ci/call-bundle-proof.py && python3 ci/direct-phase1-proof.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: call-bundle-proof
          path: |
            call-proof/
            screenshots/emulator-preflight/
          if-no-files-found: error
