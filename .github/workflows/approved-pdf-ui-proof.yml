        \ actionBarHeightDp\\n    const val compactIdentityTextSizeSp = 26\\n    const val expandedHeaderHeightDp')\n p.write_text(text)\nfor n in ['app/src/main/kotlin/com/example/chat/ui/navigation/NavigationShells3.kt','app/src/main/kotlin/com/example/chat/ui/chats/home/HomeAppBars.kt']:\n p=pathlib.Path(n);p.write_text(p.read_text().replace('ReferenceLayoutMetrics.expandedIdentityHeightDp','ReferenceLayoutMetrics.compactIdentityHeightDp').replace('ReferenceLayoutMetrics.identityTextSizeSp','ReferenceLayoutMetrics.compactIdentityTextSizeSp'))\n# Owner approved reactions in this APK only, November6 21:32:21 IST. No backend change.\np=pathlib.Path('app/src/main/java/com/example/chat/ReleaseFeatures.kt')\nif not p.exists():p=pathlib.Path('app/src/main/kotlin/com/example/chat/ReleaseFeatures.kt')\ntext=p.read_text();assert 'MESSAGE_REACTIONS = false' in text or 'MESSAGE_REACTIONS = true' in text\np.write_text(text.replace('MESSAGE_REACTIONS = false','MESSAGE_REACTIONS = true'))\nprint('Approved\
        \ PDF UI source files' ,len(z.namelist()))\nPYUI\n"
    - name: Call bundle source contracts
      run: python3 ci/tests/test_call_bundle_settings_contract.py -v
    - name: PDF identity and native parser contracts
      run: 'python3 ci/tests/test_application_identity_contract.py -v

        python3 ci/tests/test_native_alignment.py -v

        '
    - name: Disable unused Firebase messaging entrypoint
      run: rm -f app/src/main/java/com/example/chat/notifications/ChatyFirebaseMessagingService.kt
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.11.1
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: 'mls-native -> target

          '
        cache-on-failure: true
    - name: Install cargo-ndk
      run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
    - name: Set Android NDK for cargo-ndk
      run: 'NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)

        echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

        echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

        '
    - name: Generate UniFFI bindings (diagnostic)
      run: 'gradle :app:generateUniffiBindings --no-daemon

        echo ''--- generated tree ---''

        find app/build/generated/uniffi -type f | head -20

        '
    - name: Materialize Chaty signing keystore
      env:
        CHATY_KEYSTORE_B64: ${{ secrets.CHATY_KEYSTORE_B64 }}
        CHATY_KEYSTORE_PASSWORD: ${{ secrets.CHATY_KEYSTORE_PASSWORD }}
      run: "mkdir -p ci/keystore\nif [ -n \"${CHATY_KEYSTORE_B64:-}\" ] && [ -n \"${CHATY_KEYSTORE_PASSWORD:-}\" ]; then\n  printf '%s' \"$CHATY_KEYSTORE_B64\" | base64 -d > ci/keystore/chaty-release.jks\n  chmod 600 ci/keystore/chaty-release.jks\n  echo \"CHATY_KEYSTORE_PASSWORD=$CHATY_KEYSTORE_PASSWORD\" >> \"$GITHUB_ENV\"\n  echo \"Materialized Chaty release keystore from secrets.\"\nelse\n  keytool -genkeypair -v -keystore ci/keystore/chaty-release.jks \\\n    -alias chaty -keyalg RSA -keysize 2048 -validity 10000 \\\n    -storepass android -keypass android \\\n    -dname \"CN=Chaty, OU=Dev, O=Chaty, L=Unknown, S=Unknown, C=US\"\n  echo \"CHATY_KEYSTORE_PASSWORD=android\" >> \"$GITHUB_ENV\"\n  echo \"Generated fallback debug keystore for Chaty build.\"\nfi\n"
    - name: Build debug APK (compile verification)
      run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
    - name: Unit tests unchanged
      run: gradle :app:testDebugUnitTest --no-daemon
    - name: Record screenshot APK identity
      run: 'mkdir -p evidence apk

        cp app/build/outputs/apk/debug/app-debug.apk apk/app-debug.apk

        sha256sum apk/app-debug.apk > evidence/apk-sha256.txt

        AAPT=$(ls "$ANDROID_HOME/build-tools/"*/aapt | sort -V | tail -1)

        "$AAPT" dump badging apk/app-debug.apk > /tmp/apk-badging.txt

        awk -F"''" ''/^package: name=/ {print "TEST_PACKAGE=" $2}'' /tmp/apk-badging.txt >> "$GITHUB_ENV"

        '
    - name: Enable KVM
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - name: Prepare bounded capture script
      run: "cat > /tmp/capture.py <<'PY'\nimport os,pathlib,subprocess,time,re,xml.etree.ElementTree as ET\nout=pathlib.Path('evidence');out.mkdir(exist_ok=True)\ndef adb(*args):\n r=subprocess.run(['adb',*args],stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=45)\n if r.returncode:raise RuntimeError('Device command failed; arguments withheld')\n return r.stdout\ndef nodes():\n for attempt in range(3):\n  try:\n   adb('shell','rm','-f','/sdcard/view.xml')\n   adb('shell','uiautomator','dump','/sdcard/view.xml')\n   return list(ET.fromstring(adb('shell','cat','/sdcard/view.xml')).iter('node'))\n  except (RuntimeError,ET.ParseError):\n   if attempt==2:raise\n   time.sleep(2)\ndef tap(n):\n b=list(map(int,re.findall(r'\\d+',n.get('bounds',''))));adb('shell','input','tap',str((b[0]+b[2])//2),str((b[1]+b[3])//2))\ndef match(text):\n for n in nodes():\n  if n.get('text')==text or n.get('content-desc')==text:return n\n return None\ndef click(text):\n # Use one hierarchy per attempt, avoiding\
        \ a separate wait/tap read race.\n for _ in range(20):\n  ns=nodes()\n  launcher=next((n for n in ns if n.get('text')==\"Pixel Launcher isn't responding\"),None)\n  if launcher is not None:\n   button=next((n for n in ns if n.get('text')=='Wait'),None)\n   if button is not None:tap(button)\n   time.sleep(2);continue\n  n=next((n for n in ns if n.get('text')==text or n.get('content-desc')==text),None)\n  if n is not None:tap(n);return\n  time.sleep(2)\n capture('99-missing-control')\n (out/'99-missing-control.xml').write_bytes(adb('shell','cat','/sdcard/view.xml'))\n raise RuntimeError('Expected control missing: '+text)\ndef wait(text,secs=30):\n launcher_closed=False\n for _ in range(secs//2):\n  if match(\"Pixel Launcher isn't responding\") is not None:\n   click('Wait');launcher_closed=True;time.sleep(2)\n  if match(text) is not None:return\n  time.sleep(2)\n raise RuntimeError('Expected screen missing: '+text)\ndef capture(name):\n (out/(name+'.png')).write_bytes(adb('exec-out','screencap','-p'))\n\
        def scroll():adb('shell','input','swipe','540','1700','540','650','500')\nactivity=adb('shell','cmd','package','resolve-activity','--brief',os.environ['TEST_PACKAGE']).decode().strip().splitlines()[-1]\nif '/' not in activity:raise RuntimeError('Launcher activity not resolved')\nadb('shell','am','start','-n',activity)\ntime.sleep(3);capture('00-blank-entry')\ntry:wait('Register',60)\nexcept RuntimeError:\n capture('00-blank-entry-failed')\n try:(out/'00-blank-entry.xml').write_bytes(adb('shell','cat','/sdcard/view.xml'))\n except RuntimeError:pass\n raise\nclick('Log In');wait('Email or username',30);time.sleep(1)\ncapture('00-blank-login')\nclick('Try demo');time.sleep(15)\ncapture('00-first-run-prompts')\nfor control in ['Not now','Close','Not Now']:\n if match(control) is not None:click(control);time.sleep(2)\nns=nodes()\nif any(n.get('class')=='android.widget.EditText' and n.get('password')=='true' for n in ns):\n capture('01-demo-entry-result')\n (out/'status.txt').write_text('Try\
        \ the demo tapped once; still on auth. No credentials entered.')\n raise RuntimeError('Demo did not reach Home')\n(out/'01-demo-screen.xml').write_bytes(adb('shell','cat','/sdcard/view.xml'))\n# Capture only after password fields are absent; error captures must never reveal inputs.\nns=nodes()\nif any(n.get('class')=='android.widget.EditText' and n.get('password')=='true' for n in ns):\n # Do not dump errors that could echo request bodies. Report generic blocked state only.\n (out/'status.txt').write_text('Registration did not reach Home. No second submit. No auth screenshots or hierarchy uploaded. Verification or error needs private review.')\n raise RuntimeError('Registration did not reach Home')\nlabels=[n.get('text','') for n in ns]\nif any(n.get('password')=='true' for n in ns):\n (out/'status.txt').write_text('Post-registration screen not recognized as Chats Home; capture withheld to avoid unexpected account state.')\n raise RuntimeError('Home not established')\ncapture('01-actual-home-fullscreen')\n\
        adb('shell','am','force-stop',os.environ['TEST_PACKAGE']);adb('shell','monkey','-p',os.environ['TEST_PACKAGE'],'-c','android.intent.category.LAUNCHER','1');time.sleep(12)\nfor control in ['Not now','Close','Not Now']:\n if match(control) is not None:click(control);time.sleep(2)\ncapture('02-actual-home-reopened')\ndef snap(name):\n capture(name)\n nodes()\n (out/(name+'.xml')).write_bytes(adb('shell','cat','/sdcard/view.xml'))\ntry:\n snap('03-approved-home')\n click('More options');time.sleep(2);snap('04-approved-home-overflow');adb('shell','input','keyevent','4');time.sleep(1)\n ns=nodes();chat=next((n for n in ns if n.get('text')=='Aisha (sample)'),None)\n if chat is None:chat=next((n for n in ns if 'Aisha' in n.get('text','')),None)\n assert chat is not None,'Demo conversation missing'\n tap(chat);time.sleep(3);snap('05-approved-conversation')\n ns=nodes();bubble=next((n for n in ns if n.get('text')=='Exactly. Everything here is offline demo data.'),None)\n if bubble is not None:\n\
        \  tap(bubble);time.sleep(2);snap('06-approved-single-tap');adb('shell','input','keyevent','4');time.sleep(1)\n  b=list(map(int,re.findall(r'\\d+',bubble.get('bounds',''))));x=str((b[0]+b[2])//2);y=str((b[1]+b[3])//2)\n  adb('shell','input','swipe',x,y,x,y,'900');time.sleep(2);snap('07-approved-long-press')\n  adb('shell','input','keyevent','4');time.sleep(1);adb('shell','input','keyevent','4');time.sleep(1)\n adb('shell','input','keyevent','4');time.sleep(2)\n for tab in ['Calls','Tasks','Settings']:\n  click(tab);time.sleep(3);snap('08-approved-'+tab.lower())\n for _ in range(6):\n  if match('Home Screen') is not None or match('Home screen') is not None:break\n  scroll();time.sleep(1)\n if match('Home Screen') is not None:click('Home Screen')\n else:click('Home screen')\n time.sleep(3);snap('09-home-screen-settings')\n assert match('BOTTOM NAVIGATION PREVIEW') is None,'Standalone preview still present'\n assert match('Hide Tasks tab') is None,'Hide Tasks still on Home settings'\n\
        \ assert match('Hide Updates tab') is None,'Hide Updates still on Home settings'\n click('Header');time.sleep(3)\n for _ in range(4):\n  if match('Hide Tasks tab') is not None and match('Hide Updates tab') is not None:break\n  scroll();time.sleep(1)\n assert match('Hide Tasks tab') is not None and match('Hide Updates tab') is not None,'Hide options missing from Header'\n snap('10-header-hide-options')\n (out/'status.txt').write_text('Approved UI capture using offline demo. No sends/calls/settings toggles.')\nexcept Exception as e:\n snap('99-navigation-blocked');(out/'status.txt').write_text('Capture blocked: '+str(e));raise\nfinally:\n adb('shell','rm','-f','/sdcard/view.xml')\nPY\n"
    - name: Capture user-selected built-in demo Home
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        target: google_apis
        arch: x86_64
        profile: pixel_6
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
        script: 'adb install apk/app-debug.apk > /tmp/install.txt 2>&1

          python3 /tmp/capture.py


          adb install -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk > /tmp/test-install.txt 2>&1

          adb shell am instrument -w -e class com.example.chat.ApprovedLoginCapsuleProofTest "$TEST_PACKAGE.test/androidx.test.runner.AndroidJUnitRunner" | tee evidence/login-instrumentation.txt

          ! grep -E ''FAILURES|INSTRUMENTATION_FAILED|Process crashed|shortMsg='' evidence/login-instrumentation.txt

          grep -q ''OK (3 tests)'' evidence/login-instrumentation.txt

          adb pull "/sdcard/Android/data/$TEST_PACKAGE/files/screenshots" evidence/login-fixture-screenshots

          '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: actual-home-fullscreen-evidence
        path: evidence/
        retention-days: 1
        if-no-files-found: error
    - name: Upload installable APK ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Chaty-approved-PDF-debug-APK
        path: apk/app-debug.apk
        retention-days: 7
