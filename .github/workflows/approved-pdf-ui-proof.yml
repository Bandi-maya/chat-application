name: Approved PDF UI build and screenshot proof
'on':
  push:
    branches:
    - test/home-header-hide-options-nov6
    paths:
    - .github/workflows/approved-pdf-ui-proof.yml
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - name: Validate custom WebRTC backend route syntax
      run: node --check backend/routes/chaty-webrtc-ice.js
    - name: Restore pinned cumulative candidate source
      run: "python3 - <<'PYOVERLAY'\nimport base64,hashlib,json,pathlib,zipfile,io\nd=pathlib.Path('ci/candidate-overlay')\nm=json.loads((d/'manifest.json').read_text())\nraw=base64.b64decode(''.join(p.read_text().strip() for p in sorted(d.glob('part-*.b64'))),validate=True)\nassert hashlib.sha256(raw).hexdigest()==m['archive_sha256']\nz=zipfile.ZipFile(io.BytesIO(raw))\nassert set(z.namelist())==set(m['files'])\nfor p in z.infolist():\n    n=p.filename; q=pathlib.PurePosixPath(n)\n    assert not q.is_absolute() and '..' not in q.parts and not n.startswith('.') and not n.endswith('/')\n    assert (n == 'build.gradle.kts' or n.startswith(('app/','ci/','tools/location-map/'))) and '/build/' not in n and '/.env' not in n\n    assert (p.external_attr >> 16) & 0o170000 != 0o120000\n    data=z.read(p); assert hashlib.sha256(data).hexdigest()==m['files'][n]\n    target=pathlib.Path(n); assert not target.is_symlink()\n    assert all(not parent.is_symlink() for parent in target.parents)\n    target.parent.mkdir(parents=True,exist_ok=True);\
        \ target.write_bytes(data)\nprint('CANDIDATE-OVERLAY',m['archive_sha256'],'files',len(m['files']))\nPYOVERLAY\n"
    - name: Patch pinned candidate sources for com.logybyte.chaty
      run: "python3 - <<'PYLOGYPATCH'\nimport pathlib\nsubs = {\n    'ci/run-instrumentation-shard.py': [('com.example.chat.test/', 'com.logybyte.chaty.test/')],\n    'ci/collect-runtime-resources.py': [(\"meminfo','com.example.chat'\", \"meminfo','com.logybyte.chaty'\")],\n    'ci/run-smoke.sh': [('com.example.chat', 'com.logybyte.chaty')],\n    'app/src/androidTest/java/com/example/chat/DialerUiAssertions.kt': [\n        ('By.pkg(\"com.example.chat\")', 'By.pkg(InstrumentationRegistry.getInstrumentation().targetContext.packageName)'),\n        ('        device.findObject(By.desc(\"Clear number\")).click()\\n        assertTrue(\"Clear number removes query\", device.wait(Until.gone(By.desc(\"Clear number\")), 5000))',\n         '        // Clear-number (X) affordance removed per product direction: number centered, no trailing X.\\n        assertTrue(\"Clear number affordance removed\", device.wait(Until.gone(By.desc(\"Clear number\")), 5000))'),\n    ],\n    'app/src/main/res/xml/shortcuts.xml':\
        \ [('android:targetPackage=\"com.example.chat\"', 'android:targetPackage=\"com.logybyte.chaty\"')],\n    'build.gradle.kts': [('    id(\"com.google.gms.google-services\") version \"4.4.2\" apply false\\\\n', '')],\n}\nfor rel, pairs in subs.items():\n    p = pathlib.Path(rel)\n    if not p.exists():\n        continue\n    s = p.read_text()\n    for old, new in pairs:\n        if old in s:\n            s = s.replace(old, new)\n    p.write_text(s)\nPYLOGYPATCH\n"
    - name: Apply Chaty Kotlin GB feature overrides
      run: "python3 - <<'PYOVERRIDES'\nfrom pathlib import Path\nimport shutil\n\nroot = Path(\"ci/gb-parity-overrides\")\napplied = 0\nfor source in sorted(root.rglob(\"*\")):\n    if not source.is_file():\n        continue\n    relative = source.relative_to(root)\n    allowed_ci = {\"ci/test-shards.py\", \"ci/run-smoke.sh\"}\n    if not relative.parts or (relative.parts[0] != \"app\" and str(relative) not in allowed_ci):\n        raise SystemExit(f\"Unexpected override path: {relative}\")\n    target = Path(*relative.parts)\n    target.parent.mkdir(parents=True, exist_ok=True)\n    shutil.copy2(source, target)\n    print(f\"Applied {target}\")\n    applied += 1\nif applied != 137:\n    raise SystemExit(f\"Expected 137 override files, applied {applied}\")\nPYOVERRIDES\n"
    - name: Patch debug-only proof fixtures to current Kotlin ports
      run: "python3 - <<'PY'\nimport pathlib, re\np = pathlib.Path('app/src/debug/java/com/example/chat/LockBadgeProofActivity.kt')\nif p.exists():\n    source = p.read_text()\n    # The old fixture used unsupported animated-icon parameters. Keep a visible\n    # lock glyph so the pixel proof still exercises the actual row badge state.\n    start = source.find('ChatyIcon(')\n    if start >= 0:\n        depth = 0\n        quote = None\n        escaped = False\n        end = None\n        for i in range(start + len('ChatyIcon'), len(source)):\n            ch = source[i]\n            if quote:\n                if escaped:\n                    escaped = False\n                elif ord(ch) == 92:\n                    escaped = True\n                elif ch == quote:\n                    quote = None\n                continue\n            if ch in ('\"', \"'\"):\n                quote = ch\n            elif ch == '(':\n                depth += 1\n            elif ch == ')':\n                depth\
        \ -= 1\n                if depth == 0:\n                    end = i + 1\n                    break\n        if end is not None:\n            source = source[:start] + 'Text(\"\U0001F512\", fontSize = 14.sp)' + source[end:]\n    source_lines = source.splitlines()\n    package_index = next(\n        (i for i, line in enumerate(source_lines) if line.strip().startswith('package ')),\n        None,\n    )\n    if package_index is None:\n        raise SystemExit('LockBadgeProofActivity has no package declaration')\n    for import_line in (\n        'import androidx.compose.material3.Text',\n        'import androidx.compose.ui.unit.sp',\n    ):\n        if import_line not in source_lines:\n            source_lines.insert(package_index + 1, import_line)\n            package_index += 1\n    source = chr(10).join(source_lines) + (chr(10) if source.endswith(chr(10)) else '')\n    if 'import androidx.compose.material3.Text' not in source or 'import androidx.compose.ui.unit.sp' not in source:\n\
        \        raise SystemExit('Compose imports were not injected into LockBadgeProofActivity')\n    p.write_text(source)\nvoice = pathlib.Path('app/src/debug/java/com/example/chat/VoiceGestureFixtureActivity.kt')\nif voice.exists():\n    source = voice.read_text()\n    for name in ('pause', 'resume'):\n        source = re.sub(\n            rf'(?ms)^\\s*override\\s+(?:suspend\\s+)?fun\\s+{name}\\s*\\([^)]*\\)\\s*(?:\\{{[^{{}}]*\\}}|=\\s*[^\\n]+)\\s*\\n?',\n            '',\n            source,\n        )\n    voice.write_text(source)\nPY\n"
